<script>
/* =========================================================================
   LAND LEADS ERP — WORKING MODEL
   MP Developers | Built to accompany "Land Leads ERP — Recommendations & Roadmap"

   This version is wired to real Firebase: Firestore for the leads and every
   master list (channel partners, villages, executives, land classifications,
   drop/on-hold reasons, lead sources), and Storage for document uploads.

   >>> TO GO LIVE: paste your Firebase project config into FIREBASE_CONFIG
   below. Until you do, or if the SDK can't load, the app runs on an
   in-memory demo (MemoryDB) automatically, so it's always usable. <<<
   ========================================================================= */

// ---- 1. YOUR FIREBASE CONFIG -------------------------------------------
// Replace with the config object from Firebase Console → Project Settings →
// General → Your apps → SDK setup and configuration. Client-side Firebase
// config is not a secret — access is controlled by your Firestore/Storage
// security rules (in the Firebase Console), not by hiding this.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAe_9Y00TN7NfggpYELdQulpXgCUW7CwZ0",
  authDomain: "mp-land-leads.firebaseapp.com",
  projectId: "mp-land-leads",
  storageBucket: "mp-land-leads.firebasestorage.app",
  messagingSenderId: "933967050983",
  appId: "1:933967050983:web:1d3c969ee547c9d92e0a42"
};

// ---- Pipeline stages ------------------------------------------------------
// The pipeline's FIRST stage ('new' — every new lead starts here) and LAST
// stage ('closed' — terminal: no back-navigation out of it, unlocks Final
// Price/Date, etc.) are structurally pinned, since other code refers to
// those two keys specifically. Everything in between is admin-editable on
// Status Config: stages can be renamed, added, removed and reordered there,
// as long as New stays first and Closed stays last. STAGE_KEYS/STAGES are
// recomputed from DB via refreshStagesFromDB() at boot and whenever Status
// Config is saved.
let STAGE_KEYS = ['new','contacted','site_visited','under_eval','doc_legal','negotiation','closed'];
const DEFAULT_STAGE_CONFIG = [
  { key:'new',            label:'New',                    sla:2  },
  { key:'contacted',      label:'Contacted',               sla:7  },
  { key:'site_visited',   label:'Site Visited',            sla:5  },
  { key:'under_eval',     label:'Under Evaluation',        sla:14 },
  { key:'doc_legal',      label:'Documentation & Legal',   sla:10 },
  { key:'negotiation',    label:'Negotiation',             sla:14 },
  { key:'closed',         label:'Closed',                  sla:null },
];
let STAGES = DEFAULT_STAGE_CONFIG.map(s=>Object.assign({}, s));
let STAGE_INDEX = Object.fromEntries(STAGES.map((s,i)=>[s.key,i]));
const stageLabel = k => (STAGES.find(s=>s.key===k)||{}).label || k;
// Turns a new stage's Label into a stable, unique key (e.g. "Site Re-Visit"
// -> "site_re_visit"), avoiding collisions with existing keys.
function slugifyStageKey(label, existingKeys){
  let base = (label||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  if(!base) base = 'stage';
  let key = base, n = 2;
  while(existingKeys.includes(key)){ key = base + '_' + n; n++; }
  return key;
}
function refreshStagesFromDB(){
  const rows = (DB && DB.getStages) ? DB.getStages() : null;
  // Stored rows are fully authoritative (Status Config always saves the
  // complete, ordered stage list — including any added/removed/reordered
  // rows), so their order and set of keys drive STAGE_KEYS directly. Only
  // fall back to the shipped defaults when nothing has been saved yet.
  const source = (rows && rows.length) ? rows : DEFAULT_STAGE_CONFIG;
  STAGES = source.map(r => ({ key:r.key, label: r.label || r.key, sla: r.sla!=null ? r.sla : null }));
  STAGE_KEYS = STAGES.map(s=>s.key);
  STAGE_INDEX = Object.fromEntries(STAGES.map((s,i)=>[s.key,i]));
}
const EXTENT_UNITS = { acre:{label:'Acre',sqft:43560}, ground:{label:'Ground',sqft:2400}, cent:{label:'Cent',sqft:435.6}, sqft:{label:'Sqft',sqft:1} };
const FEAS_STATUSES = ['Not Started','In Progress','Cleared','Failed'];
const PAGE_TITLES = { dashboard:'Dashboard', progress:'Progress Details', list:'All Leads', newLead:'New Land Lead', reports:'Reports', configure:'Configure — Lead Fields', masters:'Masters', users:'Manage Users', workflow:'Workflow Config', statusConfig:'Status Config', pageAccess:'Page Access' };
const KNOWN_VIEWS = Object.keys(PAGE_TITLES);

// ---- Roles & access ------------------------------------------------------
// Head (internal role key stays 'admin' for backward compatibility with
// already-deployed accounts/data — only the display label changed, see
// ROLE_LABELS): full system access (Masters/Configure/Manage Users/Workflow
// Config/Status Config/Page Access) plus workflow-gate approval at the top
// of the chain, and can never be locked out of anything (see
// refreshViewAccessFromDB()).
// Admin (internal role key 'sysadmin' — distinct from Head's 'admin' key)
// is a separate, non-hierarchical IT-admin-style role: system configuration
// only (Manage Users/Workflow Config/Status Config/Page Access/Configure/
// Masters), no lead-data pages by default, and not part of the Executive->
// Manager->Head lead-visibility tree (no "Reports To"). Exactly which pages
// each role — including this one — can open is controlled by the Page
// Access master, editable at runtime; DEFAULT_VIEW_ACCESS below is only the
// starting point.
// Manager: all lead pages + can approve workflow gates, no Masters/Configure.
// Executive: only their own assigned leads. See the "Manage Users" nav
// module — every Manager/Head is assigned who they are the "Reports To"
// for, which drives the lead-visibility tree below.
const ROLES = ['admin','manager','executive','sysadmin'];
const ROLE_LABELS = { admin:'Head', manager:'Manager', executive:'Executive', sysadmin:'Admin' };
const ROLE_RANK = { executive:1, manager:2, admin:3, sysadmin:0 };
// Shipped defaults for the Page Access master — one array of role keys per
// page. Note this governs PAGE access only; it is a separate layer from the
// Executive->Manager->Head lead-visibility tree above, which still decides
// which LEADS a Manager/Head/Executive sees regardless of what's set here.
const DEFAULT_VIEW_ACCESS = {
  dashboard: ['admin','manager','executive'],
  progress:  ['admin','manager','executive'],
  list:      ['admin','manager','executive'],
  newLead:   ['admin','manager','executive'],
  reports:   ['admin','manager'],
  configure: ['admin','sysadmin'],
  masters:   ['admin','sysadmin'],
  users:       ['admin','sysadmin'],
  workflow:    ['admin','sysadmin'],
  statusConfig:['admin','sysadmin'],
  pageAccess:  ['admin','sysadmin'],
};
// The live, in-effect page access map — recomputed from DB via
// refreshViewAccessFromDB() at boot, on every live DB change, and whenever
// Page Access is saved. Starts as a plain copy of the defaults so the app
// works before that first refresh runs.
let VIEW_ACCESS = Object.fromEntries(Object.entries(DEFAULT_VIEW_ACCESS).map(([k,v])=>[k, v.slice()]));
function canAccessView(view){ return !!(currentUser && VIEW_ACCESS[view] && VIEW_ACCESS[view].includes(currentUser.role)); }
// Recomputes VIEW_ACCESS from whatever's saved on the Page Access master
// (falling back to the shipped defaults for any page never saved yet).
// Head ('admin') is force-included on every page no matter what was saved —
// same "always allowed" precedent as Workflow Config gates — so Head can
// never accidentally lock itself out of Page Access (or anything else).
function refreshViewAccessFromDB(){
  const rows = (DB && DB.getPageAccess) ? DB.getPageAccess() : null;
  const source = (rows && rows.length) ? rows : Object.entries(DEFAULT_VIEW_ACCESS).map(([view,roles])=>({view, roles}));
  const next = {};
  KNOWN_VIEWS.forEach(view=>{
    const row = source.find(r=>r.view===view);
    const roles = (row && row.roles && row.roles.length) ? row.roles.slice() : (DEFAULT_VIEW_ACCESS[view] || []).slice();
    if(!roles.includes('admin')) roles.push('admin');
    next[view] = roles;
  });
  VIEW_ACCESS = next;
}
// ---- Lead visibility tree -------------------------------------------------
// Leads >> Created & viewed by the Executive assigned to them >> viewed &
// edited by that Executive's Manager (via the Executive's "Reports To") >>
// viewed & edited by that Manager's Head (via the Manager's "Reports To").
// Each Manager/Head sees only their own branch, not the whole company —
// set each person's "Reports To" under Manage Users to place them in the
// tree. A lead's Assigned Executive is matched by name against a real user
// account (same convention the old flat executive-only filter already used).
function userByName(name){ return (DB.getUsers()||[]).find(u=>u.name===name); }
function userByUid(uidVal){ return (DB.getUsers()||[]).find(u=>u.uid===uidVal); }
function isDirectReport(managerUid, execName){
  const exec = userByName(execName);
  return !!(exec && exec.reportsTo === managerUid);
}
function isInHeadBranch(headUid, execName){
  const exec = userByName(execName);
  if(!exec || !exec.reportsTo) return false;
  const mgr = userByUid(exec.reportsTo);
  return !!(mgr && mgr.reportsTo === headUid);
}
// Safety net for a MID-tree gap: the Executive's Manager account exists (so
// isInHeadBranch's own "manager missing entirely" case doesn't apply) but
// that Manager hasn't been given a "Reports To" yet, so their whole branch
// isn't linked under any Head. Without this, that branch would be invisible
// to every Head — not just the wrong one — until someone notices the gap.
// Every Head sees it as a safety net (matches the "nothing goes silently
// missing while the hierarchy is configured" note below); once the Manager
// gets a Reports To, normal isInHeadBranch scoping takes back over.
function hasOrphanedManagerChain(execName){
  const exec = userByName(execName);
  if(!exec || !exec.reportsTo) return false;
  const mgr = userByUid(exec.reportsTo);
  return !!(mgr && !mgr.reportsTo);
}
function visibleLeads(){
  const all = DB.getLeads();
  if(!currentUser) return [];
  if(currentUser.role==='executive') return all.filter(l=>l.assignedExecutive===currentUser.name);
  if(currentUser.role==='manager') return all.filter(l=>isDirectReport(currentUser.uid, l.assignedExecutive));
  if(currentUser.role==='admin'){
    return all.filter(l => isInHeadBranch(currentUser.uid, l.assignedExecutive)
      || hasOrphanedManagerChain(l.assignedExecutive)
      // Safety net: a lead whose Assigned Executive doesn't match any real
      // user account (legacy data, unassigned, or the reporting tree not
      // set up yet) has nowhere else to surface — Head still sees these so
      // nothing goes silently missing while the hierarchy is configured.
      || !userByName(l.assignedExecutive));
  }
  return all;
}
// Same tree, applied to the Executive accounts themselves — used to scope
// the "Assigned Executive" dropdown/filter on New Lead, Progress Details
// and All Leads so a Manager/Head only sees executives in their own branch.
function visibleExecutives(){
  const all = DB.getUsers().filter(u=>u.role==='executive');
  if(!currentUser) return [];
  if(currentUser.role==='executive') return all.filter(u=>u.name===currentUser.name);
  if(currentUser.role==='manager') return all.filter(u=>isDirectReport(currentUser.uid, u.name));
  if(currentUser.role==='admin') return all.filter(u=>isInHeadBranch(currentUser.uid, u.name) || hasOrphanedManagerChain(u.name) || !u.reportsTo);
  return all;
}

// ---- Workflow config -------------------------------------------------------
// Role-wise From Status -> To Status mapping (like the "Entity Wise Role And
// Status Mapping" screen): each row grants ONE specific role permission to
// perform ONE specific From->To move (moving forward into a stage and
// moving back out of it are separate rows). A From status can branch to
// several To statuses — including non-adjacent jumps (e.g. Under Evaluation
// straight to Closed as a "drop"), same as the reference screen — and the
// same From->To move can have several rows, one per role allowed to perform
// it. Head can always approve every transition regardless of what's
// configured here (top-level sign-off), the same way it always could under
// the old rank-based rule.
//
// The app's built-in "Move to next stage" / "Move back" buttons on a lead
// (see renderStageTab) always cover the immediate adjacent pair and stay
// ungated by default — configuring one of those pairs here still just adds
// an approval gate to that same built-in move. Any OTHER row — a non-
// adjacent From->To pair — shows up as an EXTRA "Move to X" option on that
// lead's Stage & Actions tab, gated by whichever role(s) this table lists.
// From==='closed' rows are accepted here for full flexibility but never
// surface as an actual move (Closed stays terminal, see renderStageTab).
const DEFAULT_WORKFLOW_CONFIG = [
  { from:'doc_legal',   to:'negotiation', role:'manager', label:'Approve entry into Negotiation' },
  { from:'negotiation', to:'closed',      role:'admin',   label:'Approve Closing (Acquired)' },
];
let WORKFLOW_CONFIG = DEFAULT_WORKFLOW_CONFIG.map(w=>Object.assign({}, w));
function defaultGateLabel(from, to){ return to==='closed' ? 'Approve Closing (Acquired)' : ('Approve ' + stageLabel(from) + ' → ' + stageLabel(to)); }
// Every distinct ordered (From, To) combination across the current stage
// list — any status can map to any other status, no adjacency requirement.
function allTransitionPairs(){
  const pairs = [];
  STAGE_KEYS.forEach(from => STAGE_KEYS.forEach(to => { if(from !== to) pairs.push({ from, to }); }));
  return pairs;
}
function refreshWorkflowFromDB(){
  const rows = (DB && DB.getWorkflow) ? DB.getWorkflow() : null;
  const source = (rows && rows.length) ? rows : DEFAULT_WORKFLOW_CONFIG;
  const validPairs = allTransitionPairs();
  WORKFLOW_CONFIG = source
    .map(r => {
      // Back-compat: rows saved before From/To pairs existed only carried
      // {key,label,minRole}, meaning "approval required to enter `key` from
      // whatever stage precedes it" — migrate those to an explicit pair, and
      // rows saved before the role-wise rework carried `minRole` instead of
      // `role` — same field, new name.
      let from = r.from, to = r.to || r.key;
      if(!from && to){
        const toIdx = STAGE_INDEX[to];
        from = (toIdx > 0) ? STAGE_KEYS[toIdx-1] : null;
      }
      return { from, to, label: r.label || (from && to ? defaultGateLabel(from, to) : ''), role: r.role || r.minRole || 'admin' };
    })
    .filter(r => r.from && r.to && validPairs.some(p => p.from===r.from && p.to===r.to));
}
// A From->To move can have several rows (one per permitted role) — this
// returns all of them for that exact directional pair.
function findGates(fromKey, toKey){ return WORKFLOW_CONFIG.filter(w => w.from===fromKey && w.to===toKey); }
function findGate(fromKey, toKey){ return findGates(fromKey, toKey)[0]; }
function isGatedTransition(fromKey, toKey){ return findGates(fromKey, toKey).length > 0; }
// Head ('admin') is always allowed, matching its old top-of-rank status;
// every other role must have an explicit row for this exact From->To move.
function roleAllowedForGate(role, fromKey, toKey){
  const gates = findGates(fromKey, toKey);
  if(!gates.length) return true;
  if(role === 'admin') return true;
  return gates.some(g => g.role === role);
}
function gateRoleLabels(fromKey, toKey){ return findGates(fromKey, toKey).map(g=>ROLE_LABELS[g.role]).join(', '); }

// with it before parsing; otherwise `new Date(...)` fails and used to leak

  if(!d) return '—';

  return isNaN(dt) ? '—' : dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
};

// DATA LAYER — two implementations behind the same interface:
//   getLeads(), getLead(id), addLead(lead), updateLead(id,patch)
//   getMasters(key) [active only], getAllMasters(key), addMaster(key,fields),
//   updateMaster(key,id,patch), toggleMaster(key,id)
//   isLive(), hasStorage(), storageRef(path) [Firestore version only]
// =========================================================================

class MemoryDB {
  constructor(){
    this.leads = seedLeads().map(l => Object.assign({ id: l.leadId }, l));
    this.masters = {};
    MASTER_DEFS.forEach(m => {
      this.masters[m.key] = seedMaster(m.key).map((f,i) => Object.assign({ id: 'seed-'+m.key+'-'+i, active:true }, f));
    });
    this.fieldConfig = DEFAULT_FIELD_CONFIG.map(f=>Object.assign({}, f));
    this.stages = DEFAULT_STAGE_CONFIG.map(s=>Object.assign({}, s));
    this.workflow = DEFAULT_WORKFLOW_CONFIG.map(w=>Object.assign({}, w));
    this.pageAccess = Object.entries(DEFAULT_VIEW_ACCESS).map(([view,roles])=>({view, roles: roles.slice()}));
    this.users = DEFAULT_USERS_SEED.map(u=>Object.assign({ id:u.uid }, u));
  }
  async init(){ /* nothing to load — already seeded in memory */ }
  ready(){ return Promise.resolve(); }
  isLive(){ return false; }
  getLeads(){ return this.leads; }
  getLead(id){ return this.leads.find(l=>l.id===id); }
  async addLead(lead){ const withId = Object.assign({}, lead, { id: lead.leadId }); this.leads.unshift(withId); }
  async updateLead(id, patch){ const i=this.leads.findIndex(l=>l.id===id); if(i>-1) this.leads[i]=Object.assign({}, this.leads[i], patch, {updatedAt:new Date().toISOString()}); }
  getMasters(key){ return (this.masters[key]||[]).filter(m=>m.active!==false); }
  getAllMasters(key){ return this.masters[key]||[]; }
  async addMaster(key, fields){ this.masters[key].push(Object.assign({ id: uid('M'), active:true }, fields)); }
  async updateMaster(key, id, patch){ const arr=this.masters[key]; const i=arr.findIndex(m=>m.id===id); if(i>-1) arr[i]=Object.assign({}, arr[i], patch); }
  async toggleMaster(key, id){ const arr=this.masters[key]; const cur=arr.find(m=>m.id===id); if(cur) await this.updateMaster(key,id,{active: !(cur.active!==false)}); }
  async deleteMaster(key, id){ this.masters[key] = (this.masters[key]||[]).filter(m=>m.id!==id); }
  getFieldConfig(){ return this.fieldConfig; }
  async saveFieldConfig(rows){ this.fieldConfig = rows.map(r=>Object.assign({}, r)); }
  getStages(){ return this.stages; }
  async saveStages(rows){ this.stages = rows.map(r=>Object.assign({}, r)); }
  getWorkflow(){ return this.workflow; }
  async saveWorkflow(rows){ this.workflow = rows.map(r=>Object.assign({}, r)); }
  getPageAccess(){ return this.pageAccess; }
  async savePageAccess(rows){ this.pageAccess = rows.map(r=>({ view:r.view, roles:(r.roles||[]).slice() })); }
  // ---- Users & Access (demo-mode mock — plaintext password, memory-only) --
  getUsers(){ return this.users.filter(u=>u.active!==false); }
  getAllUsers(){ return this.users; }
  async login(email, password){
    const e = (email||'').trim().toLowerCase();
    const user = this.users.find(u=>u.email.toLowerCase()===e && u.active!==false);
    if(!user || user.password !== password) throw new Error('Incorrect email or password.');
    return Object.assign({}, user);
  }
  async logout(){ /* no-op — demo mode holds no session */ }
  async createUser({name, email, phone, role, password, reportsTo}){
    const e = (email||'').trim().toLowerCase();
    if(this.users.find(u=>u.email.toLowerCase()===e)) throw new Error('A user with that email already exists.');
    const newUid = uid('USR');
    const newUser = { id:newUid, uid:newUid, name, email:(email||'').trim(), phone: phone||'', role, password, active:true, reportsTo: reportsTo||'' };
    this.users.push(newUser);
    return Object.assign({}, newUser);
  }
  async updateUser(userUid, patch){ const i=this.users.findIndex(u=>u.uid===userUid); if(i>-1) this.users[i]=Object.assign({}, this.users[i], patch); }
  async toggleUser(userUid){ const u=this.users.find(x=>x.uid===userUid); if(u) await this.updateUser(userUid, {active: !(u.active!==false)}); }
  async deleteUser(userUid){ this.users = this.users.filter(u=>u.uid!==userUid); }
}

class FirestoreDB {
  constructor(fsdb, storage){
    this.fsdb = fsdb;
    this.storage = storage;
    this.leads = [];
    this.masters = {};
    MASTER_DEFS.forEach(m => this.masters[m.key] = []);
    this.fieldConfig = DEFAULT_FIELD_CONFIG.map(f=>Object.assign({}, f));
    this.stages = DEFAULT_STAGE_CONFIG.map(s=>Object.assign({}, s));
    this.workflow = DEFAULT_WORKFLOW_CONFIG.map(w=>Object.assign({}, w));
    this.pageAccess = Object.entries(DEFAULT_VIEW_ACCESS).map(([view,roles])=>({view, roles: roles.slice()}));
    this.users = [];
    this._onChange = null;
    this._pending = new Set(['leads', 'fieldConfig', 'stages', 'workflow', 'pageAccess', 'users', ...MASTER_DEFS.map(m=>'master:'+m.key)]);
    this._readyResolvers = [];
  }
  onChange(cb){ this._onChange = cb; }
  _markReady(tag){
    this._pending.delete(tag);
    if(this._pending.size===0){ this._readyResolvers.forEach(r=>r()); this._readyResolvers = []; }
  }
  ready(){ return this._pending.size===0 ? Promise.resolve() : new Promise(res=>this._readyResolvers.push(res)); }
  isLive(){ return true; }
  hasStorage(){ return !!this.storage; }
  storageRef(path){ return this.storage.ref(path); }

  async init(){
    // One-time seed of each master collection if it's empty, so a freshly
    // connected project isn't blank.
    for(const m of MASTER_DEFS){
      const snap = await this.fsdb.collection(m.collection).limit(1).get();
      if(snap.empty){
        const seed = seedMaster(m.key);
        const batch = this.fsdb.batch();
        seed.forEach(f=>{
          const ref = this.fsdb.collection(m.collection).doc();
          batch.set(ref, Object.assign({ active:true, createdAt: firebase.firestore.FieldValue.serverTimestamp() }, f));
        });
        await batch.commit();
      }
    }
    // One-time seed of sample leads if the leads collection is empty.
    const leadSnap = await this.fsdb.collection('leads').limit(1).get();
    if(leadSnap.empty){
      const seed = seedLeads();
      const batch = this.fsdb.batch();
      seed.forEach(lead=>{
        const ref = this.fsdb.collection('leads').doc();
        batch.set(ref, Object.assign({}, lead, { createdAt: firebase.firestore.FieldValue.serverTimestamp() }));
      });
      await batch.commit();
    }
    // One-time seed of the lead field configuration doc if it doesn't exist yet.
    const fcRef = this.fsdb.collection('settings').doc('leadFieldConfig');
    const fcSnap = await fcRef.get();
    if(!fcSnap.exists){ await fcRef.set({ rows: DEFAULT_FIELD_CONFIG }); }
    fcRef.onSnapshot(snap=>{
      this.fieldConfig = (snap.data() && snap.data().rows) || DEFAULT_FIELD_CONFIG;
      this._markReady('fieldConfig');
      if(this._onChange) this._onChange();
    }, err=>{ console.error('fieldConfig listener error', err); this._markReady('fieldConfig'); });

    // One-time seed of the stages doc if it doesn't exist yet.
    const stRef = this.fsdb.collection('settings').doc('stages');
    const stSnap = await stRef.get();
    if(!stSnap.exists){ await stRef.set({ rows: DEFAULT_STAGE_CONFIG }); }
    stRef.onSnapshot(snap=>{
      this.stages = (snap.data() && snap.data().rows) || DEFAULT_STAGE_CONFIG;
      this._markReady('stages');
      if(this._onChange) this._onChange();
    }, err=>{ console.error('stages listener error', err); this._markReady('stages'); });

    // One-time seed of the workflow config doc if it doesn't exist yet.
    const wfRef = this.fsdb.collection('settings').doc('workflow');
    const wfSnap = await wfRef.get();
    if(!wfSnap.exists){ await wfRef.set({ rows: DEFAULT_WORKFLOW_CONFIG }); }
    wfRef.onSnapshot(snap=>{
      this.workflow = (snap.data() && snap.data().rows) || DEFAULT_WORKFLOW_CONFIG;
      this._markReady('workflow');
      if(this._onChange) this._onChange();
    }, err=>{ console.error('workflow listener error', err); this._markReady('workflow'); });

    // One-time seed of the page access doc if it doesn't exist yet.
    const paRef = this.fsdb.collection('settings').doc('pageAccess');
    const paSnap = await paRef.get();
    const defaultPageAccessRows = Object.entries(DEFAULT_VIEW_ACCESS).map(([view,roles])=>({view, roles}));
    if(!paSnap.exists){ await paRef.set({ rows: defaultPageAccessRows }); }
    paRef.onSnapshot(snap=>{
      this.pageAccess = (snap.data() && snap.data().rows) || defaultPageAccessRows;
      this._markReady('pageAccess');
      if(this._onChange) this._onChange();
    }, err=>{ console.error('pageAccess listener error', err); this._markReady('pageAccess'); });

    // Users are NOT auto-seeded — real accounts are created from the Users
    // & Access master (or the one-time "create admin" screen on first run),
    // since a Firestore doc alone can't create a working login.
    this.fsdb.collection('m_users').onSnapshot(snap=>{
      this.users = snap.docs.map(d=>Object.assign({ uid:d.id, id:d.id }, d.data()));
      this._markReady('users');
      if(this._onChange) this._onChange();
    }, err=>{ console.error('users listener error', err); this._markReady('users'); });

    // Live listeners keep local caches (and the UI) in sync with Firestore.
    this.fsdb.collection('leads').orderBy('createdAt','desc').onSnapshot(snap=>{
      this.leads = snap.docs.map(d=>Object.assign({ id:d.id }, d.data()));
      this._markReady('leads');
      if(this._onChange) this._onChange();
    }, err=>{ console.error('leads listener error', err); this._markReady('leads'); });

    MASTER_DEFS.forEach(m=>{
      this.fsdb.collection(m.collection).onSnapshot(snap=>{
        this.masters[m.key] = snap.docs.map(d=>Object.assign({ id:d.id }, d.data()));
        this._markReady('master:'+m.key);
        if(this._onChange) this._onChange();
      }, err=>{ console.error(m.key+' listener error', err); this._markReady('master:'+m.key); });
    });
  }
  getLeads(){ return this.leads; }
  getLead(id){ return this.leads.find(l=>l.id===id); }
  async addLead(lead){
    await this.fsdb.collection('leads').add(Object.assign({}, lead, {
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }));
  }
  async updateLead(id, patch){
    await this.fsdb.collection('leads').doc(id).update(Object.assign({}, patch, {
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }));
  }
  getMasters(key){ return (this.masters[key]||[]).filter(m=>m.active!==false); }
  getAllMasters(key){ return this.masters[key]||[]; }
  async addMaster(key, fields){
    const def = MASTER_DEFS.find(m=>m.key===key);
    await this.fsdb.collection(def.collection).add(Object.assign({ active:true, createdAt: firebase.firestore.FieldValue.serverTimestamp() }, fields));
  }
  async updateMaster(key, id, patch){
    const def = MASTER_DEFS.find(m=>m.key===key);
    await this.fsdb.collection(def.collection).doc(id).update(patch);
  }
  async toggleMaster(key, id){
    const cur = this.masters[key].find(m=>m.id===id);
    await this.updateMaster(key, id, { active: !(cur && cur.active!==false) });
  }
  async deleteMaster(key, id){
    const def = MASTER_DEFS.find(m=>m.key===key);
    await this.fsdb.collection(def.collection).doc(id).delete();
  }
  getFieldConfig(){ return this.fieldConfig; }
  async saveFieldConfig(rows){ await this.fsdb.collection('settings').doc('leadFieldConfig').set({ rows }); }
  getStages(){ return this.stages; }
  async saveStages(rows){ await this.fsdb.collection('settings').doc('stages').set({ rows }); }
  getWorkflow(){ return this.workflow; }
  async saveWorkflow(rows){ await this.fsdb.collection('settings').doc('workflow').set({ rows }); }
  getPageAccess(){ return this.pageAccess; }
  async savePageAccess(rows){ await this.fsdb.collection('settings').doc('pageAccess').set({ rows }); }
  // ---- Users & Access -------------------------------------------------
  getUsers(){ return this.users.filter(u=>u.active!==false); }
  getAllUsers(){ return this.users; }
  // Creates the new account on a SECONDARY Firebase app instance so the
  // admin creating it stays signed in on the primary app — the standard
  // client-side workaround for admin-created users without a backend.
  async createUser({name, email, phone, role, password, reportsTo}){
    const secondaryApp = firebase.initializeApp(FIREBASE_CONFIG, 'Secondary-' + Date.now());
    try{
      const cred = await secondaryApp.auth().createUserWithEmailAndPassword((email||'').trim(), password);
      const newUid = cred.user.uid;
      await secondaryApp.auth().signOut();
      const doc = { name, email:(email||'').trim(), phone: phone||'', role, active:true, reportsTo: reportsTo||'', createdAt: firebase.firestore.FieldValue.serverTimestamp() };
      await this.fsdb.collection('m_users').doc(newUid).set(doc);
      return Object.assign({ uid:newUid, id:newUid }, doc);
    } finally {
      await secondaryApp.delete();
    }
  }
  async updateUser(userUid, patch){ await this.fsdb.collection('m_users').doc(userUid).update(patch); }
  async toggleUser(userUid){
    const u = this.users.find(x=>x.uid===userUid);
    await this.updateUser(userUid, { active: !(u && u.active!==false) });
  }
  async deleteUser(userUid){ await this.fsdb.collection('m_users').doc(userUid).delete(); }
}

// ---- Boot: pick MemoryDB or FirestoreDB, then render --------------------
let DB = null;
let currentDetailLeadId = null;

function showConnectionBadge(live, note){
  const el = document.getElementById('conn-badge');
  if(!el) return;
  el.innerHTML = live
    ? '<span class="badge badge-ok conn-dot">● Firebase Connected</span>'
    : '<span class="badge badge-warn conn-dot" title="'+(note?String(note).replace(/"/g,'\''):'Add your Firebase config near the top of this file.')+'">● Demo Mode</span>';
}

function renderDemoBanner(show, note){
  const holder = document.getElementById('banner-holder');
  if(!show){ holder.innerHTML=''; return; }
  holder.innerHTML = `<div class="banner"><div><b>Running in demo mode</b> — data is in-memory and resets on refresh.${note?(' ('+note+')'):''} Check your FIREBASE_CONFIG and Firestore/Storage rules to make this persistent again.</div><button id="banner-x">&times;</button></div>`;
  const x = document.getElementById('banner-x');
  if(x) x.onclick = () => { holder.innerHTML=''; };
}

async function boot(){
  const cfg = FIREBASE_CONFIG;
  const isPlaceholder = !cfg || !cfg.apiKey || cfg.apiKey.indexOf('REPLACE_ME') !== -1;
  const sdkLoaded = typeof firebase !== 'undefined';

  if(!isPlaceholder && sdkLoaded){
    try{
      firebase.initializeApp(cfg);
      // Explicit LOCAL persistence — the sign-in session survives a page
      // refresh (and a full browser restart). This is Firebase's default
      // anyway, but setting it explicitly avoids silently falling back to
      // an in-memory-only session in some private/incognito browser modes.
      if(typeof firebase.auth === 'function'){
        try{ await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL); }
        catch(persistErr){ console.warn('Could not set Firebase Auth persistence to LOCAL — sessions may not survive a refresh in this browser mode.', persistErr); }
      }
      const fsdb = firebase.firestore();
      const storage = (typeof firebase.storage === 'function') ? firebase.storage() : null;
      DB = new FirestoreDB(fsdb, storage);
      DB.onChange(()=>{
        refreshStagesFromDB();
        refreshWorkflowFromDB();
        refreshViewAccessFromDB();
        if(currentUser){ applyRoleVisibility(); render(); }
        if(currentDetailLeadId && document.getElementById('overlay')) renderDetailModal(currentDetailLeadId);
      });
      // DB.init() (seeding + Firestore listeners) is deliberately NOT called
      // here. Security rules that require request.auth != null (the live
      // setup guide's recommended rules) reject any Firestore read made
      // before someone has signed in — running init() this early would
      // always fail with "Missing or insufficient permissions" and
      // permanently fall back to demo mode for the rest of the page load,
      // even though the config and rules are actually fine. ensureDbInit()
      // runs it instead, once, right after sign-in succeeds — see
      // initAuth()'s onAuthStateChanged handler below.
      showConnectionBadge(true);
      renderDemoBanner(false);
    }catch(err){
      console.error('Firebase init failed — falling back to demo mode.', err);
      DB = new MemoryDB();
      await DB.init();
      showConnectionBadge(false, err.message);
      renderDemoBanner(true, 'connection error: ' + err.message);
    }
  } else {
    DB = new MemoryDB();
    await DB.init();
    showConnectionBadge(false, isPlaceholder ? 'no Firebase config set yet' : 'SDK did not load');
    renderDemoBanner(true, isPlaceholder ? 'no Firebase config set yet' : 'the Firebase SDK did not load');
  }
  refreshStagesFromDB();
  refreshWorkflowFromDB();
  refreshViewAccessFromDB();
  initAuth();
}

// =========================================================================
// AUTH / ACCESS — a real login gate in front of the whole app. Live mode
// uses Firebase Authentication; demo mode uses a lightweight in-memory
// mock (see DEFAULT_USERS_SEED) so the whole flow works the same offline.
// =========================================================================
let currentUser = null;

// Firestore reads/writes under the recommended live security rules require
// a signed-in user (request.auth != null), so FirestoreDB's init() — which
// seeds every collection and subscribes to it — can only safely run once
// someone has actually signed in. Called once, right after the first
// successful sign-in (see onAuthStateChanged below); harmless to call again.
let _dbInitPromise = null;
function ensureDbInit(){
  if(!DB.isLive()) return Promise.resolve();
  if(!_dbInitPromise) _dbInitPromise = DB.init().then(()=>DB.ready());
  return _dbInitPromise;
}

// ---- Auto sign-out after inactivity -------------------------------------
// Signs the user out after 20 minutes with no mouse/keyboard/touch/scroll
// activity, regardless of which page they're on. The listeners are wired
// once, globally, near boot(); resetIdleTimer() itself is a no-op whenever
// nobody's signed in, so it's harmless to leave them attached across
// sign-in/out cycles.
const IDLE_TIMEOUT_MS = 20 * 60 * 1000;
const IDLE_ACTIVITY_EVENTS = ['mousemove','mousedown','keydown','scroll','touchstart','click'];
let idleTimer = null;
let pendingLoginMessage = null;
function resetIdleTimer(){
  if(!currentUser) return;
  if(idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(onIdleTimeout, IDLE_TIMEOUT_MS);
}
function stopIdleTimer(){
  if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
}
async function onIdleTimeout(){
  if(!currentUser) return;
  await doLogout('You were signed out after 20 minutes of inactivity.');
}
(function wireIdleTimerListeners(){
  IDLE_ACTIVITY_EVENTS.forEach(evt => document.addEventListener(evt, resetIdleTimer, { passive:true }));
})();

// Shared sign-out path for both the manual "Log out" button and the idle
// timeout, so both behave identically (including in demo mode, where
// there's no auth listener to drive the login screen back up on its own).
async function doLogout(reason){
  stopIdleTimer();
  if(DB.isLive()){
    pendingLoginMessage = reason || null;
    await firebase.auth().signOut();
  } else {
    await DB.logout();
    currentUser = null;
    showLoginScreen(reason);
  }
}

// While true, onAuthStateChanged steps aside and lets whoever set it drive
// currentUser/enterApp() themselves — used by the "create admin account"
// flow below, which needs to write the new profile doc and read it back in
// a guaranteed order (see the comment at suppressAuthListener=true there).
let suppressAuthListener = false;

function initAuth(){
  if(DB.isLive() && typeof firebase.auth === 'function'){
    firebase.auth().onAuthStateChanged(async fbUser => {
      if(suppressAuthListener) return;
      if(!fbUser){
        currentUser = null;
        stopIdleTimer();
        const msg = pendingLoginMessage; pendingLoginMessage = null;
        showLoginScreen(msg);
        return;
      }
      try{
        await ensureDbInit();
        const doc = await DB.fsdb.collection('m_users').doc(fbUser.uid).get();
        if(doc.exists && doc.data().active !== false){
          currentUser = Object.assign({ uid: fbUser.uid }, doc.data());
          enterApp();
        } else {
          await firebase.auth().signOut();
          showLoginScreen('Your account isn\'t set up for access yet. Ask your admin to add you under Manage Users.');
        }
      }catch(err){
        console.error('Could not load your user profile.', err);
        await firebase.auth().signOut();
        showLoginScreen('Could not verify your account: ' + err.message);
      }
    });
  } else {
    showLoginScreen();
  }
}

function friendlyAuthError(err){
  const code = (err && err.code) || '';
  if(/user-not-found|wrong-password|invalid-credential|invalid-login-credentials/.test(code)) return 'Incorrect email or password.';
  if(/too-many-requests/.test(code)) return 'Too many attempts — try again in a few minutes.';
  if(/invalid-email/.test(code)) return 'That email address looks invalid.';
  if(/email-already-in-use/.test(code)) return 'A user with that email already exists.';
  if(/weak-password/.test(code)) return 'Password must be at least 6 characters.';
  return (err && err.message) || 'Sign-in failed.';
}

function enterApp(){
  document.getElementById('auth-root').style.display = 'none';
  document.getElementById('auth-root').innerHTML = '';
  document.getElementById('app-shell').style.display = 'flex';
  applyRoleVisibility();
  renderUserInfo();
  if(!canAccessView(currentView)) currentView = 'dashboard';
  render();
  resetIdleTimer();
}

function applyRoleVisibility(){
  document.querySelectorAll('#tabs > button[data-view]').forEach(b=>{
    const allowed = VIEW_ACCESS[b.dataset.view] ? VIEW_ACCESS[b.dataset.view].includes(currentUser.role) : true;
    b.style.display = allowed ? '' : 'none';
  });
  const adminLabel = document.getElementById('admin-nav-label');
  if(adminLabel){
    // Shared by Head and the new Admin role — show the "System" group
    // whenever the signed-in user can open at least one of the pages under
    // it, rather than hardcoding a single role.
    const systemViews = ['users','workflow','statusConfig','pageAccess'];
    const hasSystemAccess = systemViews.some(v => VIEW_ACCESS[v] && VIEW_ACCESS[v].includes(currentUser.role));
    adminLabel.style.display = hasSystemAccess ? '' : 'none';
  }
}

function renderUserInfo(){
  const el = document.getElementById('user-info');
  if(!el || !currentUser) return;
  el.innerHTML = `
    <div class="who"><b>${currentUser.name}</b><span>${ROLE_LABELS[currentUser.role]||currentUser.role}</span></div>
    <button class="btn btn-sm btn-ghost" id="logout-btn">Log out</button>`;
  document.getElementById('logout-btn').onclick = () => doLogout();
}

function showLoginScreen(errorMsg){
  currentUser = null;
  const shell = document.getElementById('app-shell');
  if(shell) shell.style.display = 'none';
  const root = document.getElementById('auth-root');
  root.style.display = 'block';
  root.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>Land Leads ERP</h1>
        <div class="sub">MP Developers — sign in to continue</div>
        <form id="auth-form">
        <label>Email</label><input type="email" id="auth-email" autocomplete="username">
        <label>Password</label><input type="password" id="auth-password" autocomplete="current-password">
        ${errorMsg ? `<div class="auth-error">${errorMsg}</div>` : ''}
        <button class="btn btn-teal" id="auth-login-btn" type="submit">Sign In</button>
        </form>
        <div style="text-align:center;margin-top:14px;font-size:12px;"><a href="#" id="auth-forgot" style="color:var(--teal);">Forgot password?</a></div>
        <div style="text-align:center;margin-top:8px;font-size:12px;"><a href="#" id="auth-bootstrap-link" style="color:var(--muted);">Setting this up for the first time? Create the admin account</a></div>
        ${!DB.isLive() ? `<p style="font-size:11px;color:var(--muted);margin-top:16px;line-height:1.6;">Demo mode — try <b>Saravanan@mpdevelopers.com</b> / 123456 (Admin), <b>manager@demo.local</b> / manager123 (Manager), or <b>karthik@demo.local</b> / exec123 (Executive).</p>` : ''}
      </div>
    </div>`;
  // A real <form> with a type="submit" button means both clicking Sign In
  // AND pressing Enter in either field submit the same way (native browser
  // behavior) — no separate keydown listener needed, and no risk of it
  // firing twice.
  document.getElementById('auth-form').onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    if(!email || !password){ showLoginScreen('Enter both email and password.'); return; }
    try{
      if(DB.isLive()){
        await firebase.auth().signInWithEmailAndPassword(email, password);
        // onAuthStateChanged picks this up and calls enterApp().
      } else {
        currentUser = await DB.login(email, password);
        enterApp();
      }
    }catch(err){ showLoginScreen(friendlyAuthError(err)); }
  };
  document.getElementById('auth-forgot').onclick = async (e) => {
    e.preventDefault();
    const email = document.getElementById('auth-email').value.trim();
    if(!email){ alert('Enter your email above first, then click "Forgot password?" again.'); return; }
    if(!DB.isLive()){ alert('Password reset isn\'t available in demo mode.'); return; }
    try{ await firebase.auth().sendPasswordResetEmail(email); alert('Password reset email sent to ' + email + '.'); }
    catch(err){ alert('Could not send reset email: ' + friendlyAuthError(err)); }
  };
  document.getElementById('auth-bootstrap-link').onclick = (e) => { e.preventDefault(); showBootstrapScreen(); };
}

function showBootstrapScreen(){
  const root = document.getElementById('auth-root');
  root.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>Create the Admin Account</h1>
        <div class="sub">One-time setup — this becomes the first Admin login.</div>
        <label>Your Name</label><input type="text" id="bs-name">
        <label>Email</label><input type="email" id="bs-email" autocomplete="username">
        <label>Password</label><input type="password" id="bs-password" autocomplete="new-password" placeholder="At least 6 characters">
        <div id="bs-error"></div>
        <button class="btn btn-teal" id="bs-create-btn">Create Admin Account</button>
        <div style="text-align:center;margin-top:14px;font-size:12px;"><a href="#" id="bs-back" style="color:var(--teal);">Back to sign in</a></div>
      </div>
    </div>`;
  document.getElementById('bs-back').onclick = (e) => { e.preventDefault(); showLoginScreen(); };
  document.getElementById('bs-create-btn').onclick = async () => {
    const name = document.getElementById('bs-name').value.trim();
    const email = document.getElementById('bs-email').value.trim();
    const password = document.getElementById('bs-password').value;
    const errEl = document.getElementById('bs-error');
    errEl.innerHTML = '';
    if(!name || !email || !password){ errEl.innerHTML = '<div class="auth-error">All fields are required.</div>'; return; }
    if(password.length < 6){ errEl.innerHTML = '<div class="auth-error">Password must be at least 6 characters.</div>'; return; }
    try{
      if(DB.isLive()){
        // createUserWithEmailAndPassword fires onAuthStateChanged the
        // moment it resolves — racing the profile-doc write below. If that
        // listener's read lands first, it finds no doc yet, signs the
        // brand-new account straight back out, and shows a confusing
        // "account isn't set up for access" error even though the account
        // (and its profile) end up created moments later. Suppress the
        // listener for this one flow and drive currentUser/enterApp()
        // ourselves, in the guaranteed order: create → write → enter.
        suppressAuthListener = true;
        try{
          const cred = await firebase.auth().createUserWithEmailAndPassword(email, password);
          const profile = { name, email, phone:'', role:'admin', active:true, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
          await ensureDbInit();
          await DB.fsdb.collection('m_users').doc(cred.user.uid).set(profile);
          currentUser = Object.assign({ uid: cred.user.uid }, profile);
          enterApp();
        } finally {
          suppressAuthListener = false;
        }
      } else {
        currentUser = await DB.createUser({ name, email, phone:'', role:'admin', password });
        enterApp();
      }
    }catch(err){ errEl.innerHTML = '<div class="auth-error">' + friendlyAuthError(err) + '</div>'; }
  };
}

// ---- App state ---------------------------------------------------------
let currentView = 'dashboard';
const DEFAULT_FILTERS = { stage:'', source:'', exec:'', channelPartner:'', dateFrom:'', dateTo:'', excludeClosed:false, onHold:false, callDueOrOverdue:false, letter:'', q:'' };
let listFilters = Object.assign({}, DEFAULT_FILTERS);
let listPage = 1;
const PAGE_SIZE = 15;
let selectedLeadIds = new Set();
let currentMasterKey = MASTER_DEFS[0].key;
let editingMasterId = null;
// Progress Details is one page with its own Status/Source/Channel
// Partner/Executive/Date filter panel and a single results table.
let progressFilters = { stage:'', source:'', channelPartner:'', exec:'', dateFrom:'', dateTo:'' };
// ---- Browser Back/Forward support ------------------------------------
// Every top-level view change pushes a history entry (#dashboard, #list, …)
// so the browser's Back button steps back through in-app pages instead of
// leaving the app entirely. suppressHistoryPush prevents the popstate
// handler's own render() call from pushing a duplicate entry.
let suppressHistoryPush = false;

function render(){
  if(!canAccessView(currentView)) currentView = 'dashboard';
  document.querySelectorAll('#tabs > button[data-view]').forEach(b=>b.classList.toggle('active', b.dataset.view===currentView));
  document.getElementById('page-title').textContent = PAGE_TITLES[currentView] || '';
  const root = document.getElementById('view-root');
  if(currentView==='dashboard') root.innerHTML = renderDashboard();
  else if(currentView==='progress') root.innerHTML = renderProgress();
  else if(currentView==='list') root.innerHTML = renderList();
  else if(currentView==='newLead') root.innerHTML = renderNewLeadView();
  else if(currentView==='reports') root.innerHTML = renderReports();
  else if(currentView==='configure') root.innerHTML = renderConfigure();
  else if(currentView==='masters') root.innerHTML = renderMasters();
  else if(currentView==='users') root.innerHTML = renderUsersView();
  else if(currentView==='workflow') root.innerHTML = renderWorkflowView();
  else if(currentView==='statusConfig') root.innerHTML = renderStatusConfigView();
  else if(currentView==='pageAccess') root.innerHTML = renderPageAccessView();
  wireViewEvents();

  const wantedHash = '#' + currentView;
  if(suppressHistoryPush){
    suppressHistoryPush = false;
  } else if(location.hash !== wantedHash){
    history.pushState({ view: currentView }, '', wantedHash);
  }
}

// ---- Derived calculations ----------------------------------------------
function leadExtentSqft(l){ return extentSqft(l.extentValue, l.extentUnit); }
function leadPricePerSqft(l){ return pricePerSqft(l.priceValue, l.priceUnit); }
function leadValue(l){ return leadExtentSqft(l) * leadPricePerSqft(l); }
function isClosed(l){ return l.stage==='closed'; }
function isActive(l){ return !isClosed(l); }
function daysInStage(l){
  const last = l.stageHistory && l.stageHistory.length ? l.stageHistory[l.stageHistory.length-1] : null;
  const since = last ? new Date(last.at) : new Date(l.createdAt);
  return daysBetween(since, new Date());
}
function isOverdueStage(l){
  const st = STAGES.find(s=>s.key===l.stage);
  if(!st || st.sla==null) return false;
  return daysInStage(l) > st.sla;
}
function callBadgeInfo(l){
  if(!l.nextCallDate) return null;
  const d = new Date(l.nextCallDate); const t = new Date(todayStr());
  const diff = daysBetween(t, d);
  if(diff < 0) return {type:'danger', text:'Overdue ' + Math.abs(diff) + 'd'};
  if(diff === 0) return {type:'warn', text:'Due today'};
  return {type:'muted', text:'In ' + diff + 'd'};
}
function leadMatchesFilters(l, f){
  if(f.stage && l.stage !== f.stage) return false;
  if(f.excludeClosed && l.stage === 'closed') return false;
  if(f.source && l.leadSource !== f.source) return false;
  if(f.channelPartner && l.channelPartnerCode !== f.channelPartner) return false;
  if(f.exec && l.assignedExecutive !== f.exec) return false;
  if(f.dateFrom){ const d = (l.leadSourceDateTime||'').slice(0,10); if(!d || d < f.dateFrom) return false; }
  if(f.dateTo){ const d = (l.leadSourceDateTime||'').slice(0,10); if(!d || d > f.dateTo) return false; }
  if(f.onHold && !(l.onHold && l.onHold.active)) return false;
  if(f.callDueOrOverdue && !(l.nextCallDate && new Date(l.nextCallDate) <= new Date(todayStr()))) return false;
  if(f.letter){ const v=(l.village||'').trim().toUpperCase(); if(!v.startsWith(f.letter)) return false; }
  if(f.q){
    const q = f.q.toLowerCase();
    const hay = [l.leadId,l.village,l.siteLocation,l.landownerName,l.surveyNumber].join(' ').toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

// ---- DASHBOARD -----------------------------------------------------------
function renderDashboard(){
  const leads = visibleLeads();
  const active = leads.filter(isActive);
  const overdueCalls = leads.filter(l=>isActive(l) && l.nextCallDate && new Date(l.nextCallDate) < new Date(todayStr()));
  const dueToday = leads.filter(l=>isActive(l) && l.nextCallDate === todayStr());
  const ageingAlerts = active.filter(isOverdueStage);
  const onHoldCount = active.filter(l=>l.onHold && l.onHold.active).length;

  // Single-series magnitude-by-category chart (count of leads per stage),
  // drawn as one circle per stage rather than bars — a lead belongs to
  // exactly one stage at a time, so the stages never actually overlap as
  // sets; the circles are sized (not overlapped) by count so the "Venn"
  // look doesn't imply an overlap the data doesn't have. Circle diameter is
  // scaled by the SQRT of the count ratio so size compares by area, not
  // diameter (a stage with 4x the leads gets ~4x the area, not 4x the
  // width, which would visually overstate it). One hue (teal), value inside
  // each circle, stage labeled below — no legend needed for a single series.
  const stageMax = Math.max(1, ...STAGES.map(st=>leads.filter(l=>l.stage===st.key).length));
  const MIN_CIRCLE_PX = 46, MAX_CIRCLE_PX = 130;
  const vennCircles = STAGES.map(s=>{
    const count = leads.filter(l=>l.stage===s.key).length;
    const diameter = Math.round(MIN_CIRCLE_PX + (MAX_CIRCLE_PX - MIN_CIRCLE_PX) * Math.sqrt(count / stageMax));
    const fontSize = Math.max(12, Math.round(diameter * 0.24));
    return `<div class="vcircle-col" data-stage="${s.key}" title="${s.label}: ${count} lead${count===1?'':'s'}">
      <div class="vcircle" style="width:${diameter}px;height:${diameter}px;font-size:${fontSize}px;">${count}</div>
      <div class="vcircle-label">${s.label}</div>
    </div>`;
  }).join('');

  // "New Leads" — every lead still sitting in the very first stage, newest
  // first, with the date it was created. Clicking a row goes to the same
  // place as the dashboard's other drill-throughs — the All Leads page,
  // filtered to just these — rather than opening that one lead's detail.
  const newLeadsList = leads.filter(l=>l.stage==='new').sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,8).map(l=>
    `<div class="callitem" data-drill="newLeads" style="cursor:pointer;"><span><b>${l.leadId}</b> — ${l.village} <span style="color:var(--muted)">(${l.assignedExecutive})</span></span>
      <span class="badge badge-navy">${fmtDate(l.createdAt)}</span></div>`
  ).join('') || '<div class="empty">No new leads yet</div>';

  // "Yet to be Site Visited" — just the count of leads sitting in whichever
  // stage immediately precedes "Site Visited" (Contacted, by default), not a
  // per-lead list — click it to drill into that filtered list on All Leads.
  // Resolved by key so it keeps working if that stage gets renamed or
  // reordered on Status Config.
  const siteVisitedIdx = STAGE_KEYS.indexOf('site_visited');
  const preSiteVisitKey = siteVisitedIdx > 0 ? STAGE_KEYS[siteVisitedIdx-1] : null;
  const yetToSiteVisitCount = preSiteVisitKey ? leads.filter(l=>l.stage===preSiteVisitKey).length : 0;
  const yetToSiteVisitList = !preSiteVisitKey ? '<div class="empty">No "Site Visited" stage configured</div>' :
    `<div class="callitem" data-drill="yetToSiteVisit" data-stage-key="${preSiteVisitKey}" style="cursor:pointer;"><span><b>${yetToSiteVisitCount}</b> lead${yetToSiteVisitCount===1?'':'s'} yet to be site visited</span><span class="badge badge-warn">View in All Leads</span></div>`;

  const bySource = {};
  leads.forEach(l=>{ bySource[l.leadSource||'—']=(bySource[l.leadSource||'—']||0)+1; });
  const sourceRows = Object.entries(bySource).sort((a,b)=>b[1]-a[1]).map(([src,c])=>
    `<tr class="clickable-row" data-source="${src}"><td>${src}</td><td>${c}</td><td>${leads.length?Math.round(c/leads.length*100):0}%</td></tr>`).join('') || '<tr><td colspan="3" class="empty">No leads yet</td></tr>';

  const byCP = {};
  leads.filter(l=>l.channelPartnerCode).forEach(l=>{ byCP[l.channelPartnerCode]=(byCP[l.channelPartnerCode]||0)+1; });
  const cpRows = Object.entries(byCP).sort((a,b)=>b[1]-a[1]).map(([cp,c])=>
    `<tr class="clickable-row" data-cp="${cp}"><td>${cp}</td><td>${c}</td></tr>`).join('') || '<tr><td colspan="2" class="empty">No channel partner leads yet</td></tr>';

  const callList = leads.filter(l=>isActive(l) && l.nextCallDate).sort((a,b)=>new Date(a.nextCallDate)-new Date(b.nextCallDate)).slice(0,8).map(l=>{
    const info = callBadgeInfo(l);
    return `<div class="callitem" data-open-id="${l.id}"><span><b>${l.leadId}</b> — ${l.village} <span style="color:var(--muted)">(${l.assignedExecutive})</span></span>
      <span class="badge badge-${info.type==='danger'?'danger':info.type==='warn'?'warn':'muted'}">${info.text} · ${fmtDate(l.nextCallDate)}</span></div>`;
  }).join('') || '<div class="empty">No upcoming calls scheduled</div>';

  const ageingList = ageingAlerts.slice(0,8).map(l=>{
    const st = STAGES.find(s=>s.key===l.stage);
    return `<div class="callitem" data-open-id="${l.id}"><span><b>${l.leadId}</b> — ${l.village} <span style="color:var(--muted)">(${st.label})</span></span>
      <span class="badge badge-danger">${daysInStage(l)}d in stage (SLA ${st.sla}d)</span></div>`;
  }).join('') || '<div class="empty">No leads currently past their stage SLA</div>';

  return `
    <div class="page-header">
      <h1>Dashboard</h1>
    </div>

    <div class="grid cards4">
      <div class="card stat" data-drill="active"><div class="label">Active Leads</div><div class="value">${active.length}</div><div class="sub">${leads.length} total incl. closed — click to view</div></div>
      <div class="card stat" data-drill="onHold"><div class="label">On Hold</div><div class="value">${onHoldCount}</div><div class="sub">flagged across all stages — click to view</div></div>
      <div class="card stat" data-drill="calls"><div class="label">Calls Due / Overdue</div><div class="value" style="color:${overdueCalls.length?'var(--danger)':'var(--navy)'}">${dueToday.length} / ${overdueCalls.length}</div><div class="sub">today / overdue — click to view</div></div>
    </div>

    <h2 class="section-title">Pipeline Funnel <span class="tag">click a stage to view its leads</span></h2>
    <div class="card"><div class="venncircles">${vennCircles}</div></div>

    <div class="two-col">
      <div>
        <h2 class="section-title">New Leads</h2>
        <div class="card">${newLeadsList}</div>
      </div>
      <div>
        <h2 class="section-title">Yet to be Site Visited</h2>
        <div class="card">${yetToSiteVisitList}</div>
      </div>
    </div>

    <div class="two-col">
      <div>
        <h2 class="section-title">Call Reminders</h2>
        <div class="card">${callList}</div>
      </div>
      <div>
        <h2 class="section-title">Ageing Alerts <span class="tag" style="background:var(--danger)">Past stage SLA</span></h2>
        <div class="card">${ageingList}</div>
      </div>
    </div>

    <div class="two-col">
      <div>
        <h2 class="section-title">By Lead Source <span class="tag">click a row</span></h2>
        <div class="card"><table><tr><th>Source</th><th>Count</th><th>%</th></tr>${sourceRows}</table></div>
      </div>
      <div>
        <h2 class="section-title">By Channel Partner <span class="tag">click a row</span></h2>
        <div class="card"><table><tr><th>Code</th><th>Count</th></tr>${cpRows}</table></div>
      </div>
    </div>
  `;
}

// ---- Export helpers -------------------------------------------------------
function downloadBlob(content, filename, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function toCSV(rows){
  if(!rows.length) return '';
  const headers = Object.keys(rows[0]);
  const esc = v => { const s = v==null?'':String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  return [headers.join(',')].concat(rows.map(r=>headers.map(h=>esc(r[h])).join(','))).join('\n');
}
// ---- Generic row exporters (used by the Reports page) --------------------
function exportRowsExcel(rows, filename, sheetName){
  if(!rows.length){ alert('Nothing to export.'); return; }
  if(typeof XLSX !== 'undefined'){
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), sheetName||'Sheet1');
    XLSX.writeFile(wb, filename);
  } else {
    downloadBlob(toCSV(rows), filename.replace(/\.xlsx$/,'.csv'), 'text/csv;charset=utf-8;');
    alert('The Excel library did not load (likely offline) — downloaded a CSV instead, which opens fine in Excel.');
  }
}
function exportRowsPDF(rows, filename, title){
  if(!rows.length){ alert('Nothing to export.'); return; }
  const columns = Object.keys(rows[0]);
  if(typeof window.jspdf !== 'undefined'){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(14); doc.text(title, 14, 16);
    doc.setFontSize(9); doc.setTextColor(120); doc.text(new Date().toLocaleString('en-IN'), 14, 22); doc.setTextColor(0);
    doc.autoTable({ startY:28, head:[columns], body: rows.map(r=>columns.map(c=>r[c])), styles:{fontSize:8}, headStyles:{fillColor:[27,42,74]} });
    doc.save(filename);
  } else {
    alert("The PDF library did not load (likely offline) — using your browser's Print dialog instead. Choose \"Save as PDF\" as the destination.");
    window.print();
  }
}
function leadsReportRows(){
  return visibleLeads().map(l=>({
    'Lead ID': l.leadId, Village: l.village||'', Stage: stageLabel(l.stage), Source: l.leadSource||'',
    'Channel Partner': l.channelPartnerCode||'', Executive: l.assignedExecutive||'',
    'Lead Date': (l.leadSourceDateTime||'').slice(0,10), 'On Hold': (l.onHold&&l.onHold.active)?'Yes':'No', Outcome: l.outcome||''
  }));
}
function siteVisitReportRows(){
  const rows = [];
  visibleLeads().forEach(l=>{
    (l.stageHistory||[]).forEach(h=>{
      if(h.stage==='site_visited') rows.push({
        'Lead ID': l.leadId, Village: l.village||'', 'Visited On': (h.at||'').slice(0,10),
        'Logged By': h.by||'', Executive: l.assignedExecutive||'', Source: l.leadSource||''
      });
    });
  });
  rows.sort((a,b)=> (b['Visited On']||'').localeCompare(a['Visited On']||''));
  return rows;
}

// ---- ALL LEADS LIST (dense ERP-style table page) --------------------------
function renderList(){
  const sources = DB.getMasters('leadSources');
  const cps = DB.getMasters('channelPartners');
  const execs = visibleExecutives();
  const fcfg = fieldConfigMap();
  const allLeads = visibleLeads();
  const filtered = allLeads.filter(l=>leadMatchesFilters(l, listFilters));
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total/PAGE_SIZE));
  if(listPage > totalPages) listPage = totalPages;
  const startIdx = (listPage-1)*PAGE_SIZE;
  const pageItems = filtered.slice(startIdx, startIdx+PAGE_SIZE);
  const letters = ['ALL', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')];

  const rows = pageItems.map(l=>{
    const checked = selectedLeadIds.has(l.id) ? 'checked' : '';
    return `<tr>
      <td><input type="checkbox" class="row-check" data-id="${l.id}" ${checked}></td>

      <td class="clickable-row" data-id="${l.id}">${l.village||'—'}</td>
      <td class="clickable-row" data-id="${l.id}">${l.surveyNumber||'—'}</td>
      <td class="clickable-row" data-id="${l.id}">${fmtNum(l.extentValue)} ${EXTENT_UNITS[l.extentUnit]?.label}</td>
      <td class="clickable-row" data-id="${l.id}">${fmtNum(l.priceValue)} / ${EXTENT_UNITS[l.priceUnit]?.label}</td>
      <td class="clickable-row" data-id="${l.id}">${l.landownerName||'—'}</td>

    </tr>`;
  }).join('') || `<tr><td colspan="10" class="empty">No leads match these filters</td></tr>`;

  return `
    <div class="page-header">
      <h1>All Leads</h1>
      <button class="btn btn-gold" id="btn-new-lead">+ Create New Lead</button>
    </div>

    <div class="card filter-panel">
      <div class="form-grid">
        ${(!fcfg.leadSource || fcfg.leadSource.filter!==false) ? `<div><label>Lead Source</label><select id="lf-source">
          <option value="">All sources</option>${sources.map(s=>`<option value="${s.label}" ${listFilters.source===s.label?'selected':''}>${s.label}</option>`).join('')}
        </select></div>` : ''}
        ${(!fcfg.channelPartnerCode || fcfg.channelPartnerCode.filter!==false) ? `<div><label>Channel Partner</label><select id="lf-cp">
          <option value="">All partners</option>${cps.map(c=>`<option value="${c.code}" ${listFilters.channelPartner===c.code?'selected':''}>${c.code} — ${c.name}</option>`).join('')}
        </select></div>` : ''}
        ${(!fcfg.assignedExecutive || fcfg.assignedExecutive.filter!==false) ? `<div><label>Assigned Executive</label><select id="lf-exec">
          <option value="">All executives</option>${execs.map(e=>`<option value="${e.name}" ${listFilters.exec===e.name?'selected':''}>${e.name}</option>`).join('')}
        </select></div>` : ''}
        <div><label>Lead Date From</label><input type="date" id="lf-datefrom" value="${listFilters.dateFrom}"></div>
        <div><label>Lead Date To</label><input type="date" id="lf-dateto" value="${listFilters.dateTo}"></div>
      </div>
      <div class="filter-actions">
        <button class="btn btn-sm btn-ghost" id="lf-clear">Clear Filters</button>
        <button class="btn btn-sm btn-teal" id="lf-go">Search</button>
      </div>
    </div>

    <div class="toolbar" style="justify-content:space-between;">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
        <input type="text" id="f-q" placeholder="Search village, owner, survey no…" value="${listFilters.q}">
        <div class="index-nav">${letters.map(L=>{
          const isAll = L==='ALL';
          const active = isAll ? !listFilters.letter : listFilters.letter===L;
          return `<button class="idx-btn ${active?'active':''}" data-letter="${isAll?'':L}">${L}</button>`;
        }).join('')}</div>
      </div>
      <button class="btn btn-sm btn-ghost" id="btn-export-list">⬇ Export (CSV)</button>
    </div>

    <div class="card" style="padding:0;overflow-x:auto;">
      <table class="leads-table">
        <tr><th><input type="checkbox" id="check-all"></th><th>Lead ID</th><th>Village</th><th>Survey No.</th><th>Extent</th><th>Quoted Price</th><th>Landowner</th><th>Source</th><th>Executive</th><th></th></tr>
        ${rows}
      </table>
    </div>

    <div class="pagination">
      <span>Displaying ${total?startIdx+1:0}–${Math.min(startIdx+PAGE_SIZE,total)} of ${total} record${total===1?'':'s'}</span>
      <div class="page-btns">
        <button class="btn btn-sm btn-ghost" id="pg-first" ${listPage<=1?'disabled':''}>«</button>
        <button class="btn btn-sm btn-ghost" id="pg-prev" ${listPage<=1?'disabled':''}>‹</button>
        <span class="page-num">${listPage} / ${totalPages}</span>
        <button class="btn btn-sm btn-ghost" id="pg-next" ${listPage>=totalPages?'disabled':''}>›</button>
        <button class="btn btn-sm btn-ghost" id="pg-last" ${listPage>=totalPages?'disabled':''}>»</button>

}

function wireListEvents(){
  const val = id => (document.getElementById(id)?.value || '').trim();
  const goBtn = document.getElementById('lf-go');
  if(goBtn) goBtn.onclick = () => {
    // Source/Channel Partner/Executive filters can be hidden via the Configure
    // page's Filter flag — only read them when actually rendered.
    if(document.getElementById('lf-source')) listFilters.source = val('lf-source');
    if(document.getElementById('lf-cp')) listFilters.channelPartner = val('lf-cp');
    if(document.getElementById('lf-exec')) listFilters.exec = val('lf-exec');
    listFilters.dateFrom = val('lf-datefrom');
    listFilters.dateTo = val('lf-dateto');
    listPage = 1;
    render();
  };
  const clearBtn = document.getElementById('lf-clear');
  if(clearBtn) clearBtn.onclick = () => { listFilters = Object.assign({}, DEFAULT_FILTERS); listPage = 1; render(); };

  const q = document.getElementById('f-q');
  if(q) q.addEventListener('input', () => { listFilters.q = q.value; listPage = 1; render(); });

  document.querySelectorAll('[data-letter]').forEach(b=>b.onclick = () => { listFilters.letter = b.dataset.letter; listPage = 1; render(); });

  document.querySelectorAll('.row-check').forEach(c=>c.addEventListener('change', () => {
    if(c.checked) selectedLeadIds.add(c.dataset.id); else selectedLeadIds.delete(c.dataset.id);
  }));
  const checkAll = document.getElementById('check-all');
  if(checkAll) checkAll.addEventListener('change', () => {
    document.querySelectorAll('.row-check').forEach(c=>{
      c.checked = checkAll.checked;
      if(checkAll.checked) selectedLeadIds.add(c.dataset.id); else selectedLeadIds.delete(c.dataset.id);
    });
  });

  document.querySelectorAll('[data-view-id]').forEach(b=>b.onclick = (e) => { e.stopPropagation(); openLeadDetail(b.dataset.viewId); });
  document.querySelectorAll('td.clickable-row').forEach(td=>td.addEventListener('click', () => openLeadDetail(td.dataset.id)));

  const pgFirst = document.getElementById('pg-first'); if(pgFirst) pgFirst.onclick = () => { listPage = 1; render(); };
  const pgPrev = document.getElementById('pg-prev'); if(pgPrev) pgPrev.onclick = () => { listPage = Math.max(1, listPage-1); render(); };
  const pgNext = document.getElementById('pg-next'); if(pgNext) pgNext.onclick = () => { listPage = listPage+1; render(); };
  const pgLast = document.getElementById('pg-last'); if(pgLast) pgLast.onclick = () => {
    const total = visibleLeads().filter(l=>leadMatchesFilters(l, listFilters)).length;
    listPage = Math.max(1, Math.ceil(total/PAGE_SIZE)); render();
  };

  const exportBtn = document.getElementById('btn-export-list');
  if(exportBtn) exportBtn.onclick = () => {
    const filtered = visibleLeads().filter(l=>leadMatchesFilters(l, listFilters));
    const source = selectedLeadIds.size ? filtered.filter(l=>selectedLeadIds.has(l.id)) : filtered;
    if(!source.length){ alert('Nothing to export.'); return; }
    const rows = source.map(l=>({
      'Lead ID': l.leadId, Village: l.village||'', 'Survey No.': l.surveyNumber||'',
      Extent: l.extentValue, 'Extent Unit': EXTENT_UNITS[l.extentUnit]?.label||'',
      Price: l.priceValue, 'Price Unit': EXTENT_UNITS[l.priceUnit]?.label||'',
      Landowner: l.landownerName||'', Source: l.leadSource||'', Executive: l.assignedExecutive||''
    }));
    downloadBlob(toCSV(rows), 'Land_Leads_List.csv', 'text/csv;charset=utf-8;');
  };

  const newBtn = document.getElementById('btn-new-lead');
  if(newBtn) newBtn.addEventListener('click', goToNewLead);
}

// ---- MASTERS -------------------------------------------------------------
// Plain reference-data masters (lead sources, channel partners, villages,
// land classes, drop/hold reasons). Manage Users, Workflow Config and
// Status Config are their own standalone nav modules below, not tucked
// into this dropdown — simpler to find and less to scroll past.
function renderMasters(){

  const items = DB.getAllMasters(def.key);
  const rows = items.map(it=>`<tr>
      ${def.fields.map(f=>`<td>${it[f]!=null && it[f]!=='' ? it[f] : '—'}</td>`).join('')}

        </select></div>
      </div>
      <div class="filter-actions"><button class="btn btn-sm btn-teal" id="master-go">Go</button></div>
    </div>

      <table>

        ${rows}
      </table>
    </div>
    <div class="card">
      <h2 class="section-title" style="margin-top:0;">${editing?('Edit '+singular):('Add '+singular)}</h2>
      <div class="form-grid">
        ${def.fields.map(f=>`<div><label>${FIELD_LABELS[f]||f}</label><input type="${f==='commissionPct'?'number':'text'}" id="mf-${f}" ${f==='commissionPct'?'step="0.01"':''} value="${editing && editing[f]!=null ? editing[f] : ''}"></div>`).join('')}
      </div>
      <div style="margin-top:10px;display:flex;gap:8px;">
        <button class="btn btn-sm btn-teal" id="master-save">${editing?'Update':'Add'}</button>
        ${editing?'<button class="btn btn-sm btn-ghost" id="master-cancel">Cancel</button>':''}

function wireMastersEvents(){
  const sel = document.getElementById('master-select');
  const switchMaster = () => { currentMasterKey = sel.value; editingMasterId=null; render(); };
  const goBtn = document.getElementById('master-go');
  if(goBtn) goBtn.onclick = switchMaster;
  if(sel) sel.addEventListener('change', switchMaster);

  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick = () => { editingMasterId=b.dataset.edit; render(); });
  document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick = async () => { await DB.toggleMaster(currentMasterKey, b.dataset.toggle); render(); });
  document.querySelectorAll('[data-delete]').forEach(b=>b.onclick = async () => {
    if(!confirm('Delete this entry permanently? This cannot be undone.')) return;
    await DB.deleteMaster(currentMasterKey, b.dataset.delete);
    if(editingMasterId===b.dataset.delete) editingMasterId=null;
    render();
  });
  const saveBtn = document.getElementById('master-save');
  if(saveBtn) saveBtn.onclick = async () => {
    const def = MASTER_DEFS.find(m=>m.key===currentMasterKey);
    const fields = {};
    let ok = true;
    def.fields.forEach(f=>{
      const el = document.getElementById('mf-'+f);
      let v = el.value.trim();
      if(f==='commissionPct') v = v==='' ? null : parseFloat(v);
      if(f===def.fields[0] && v==='' ) ok = false;
      fields[f] = v;
    });
    if(!ok){ alert('The first field is required.'); return; }
    if(editingMasterId){ await DB.updateMaster(currentMasterKey, editingMasterId, fields); editingMasterId=null; }
    else { await DB.addMaster(currentMasterKey, fields); }
    render();
  };
  const cancelBtn = document.getElementById('master-cancel');
  if(cancelBtn) cancelBtn.onclick = () => { editingMasterId=null; render(); };
}

// ---- MANAGE USERS (own module — was folded into Masters, now standalone) --
// Real accounts (Firebase Authentication when live) replace the old
// free-text "Executives" master. Each user has a role — see ROLES above —
// that governs which pages they can see and, for Executives, which leads.
// A Manager's "Reports To" offers Heads; an Executive's offers Managers;
// a Head (role 'admin') has no Reports To — they're the top of their branch.
function reportsToCandidates(role){
  const items = DB.getAllUsers();
  if(role==='executive') return items.filter(u=>u.role==='manager' && u.active!==false);
  if(role==='manager') return items.filter(u=>u.role==='admin' && u.active!==false);
  return [];
}
function reportsToOptionsHtml(role, selectedUid){
  const list = reportsToCandidates(role);
  const empty = list.length ? '— unassigned —' : '— none available yet, add one first —';
  return `<option value="">${empty}</option>` + list.map(u=>`<option value="${u.uid}" ${selectedUid===u.uid?'selected':''}>${u.name}</option>`).join('');
}

  const items = DB.getAllUsers();

        <button class="icon-btn icon-del" data-user-delete="${u.uid}" title="Remove access record">🗑</button>
      </td>

  }).join('') || `<tr><td colspan="7" class="empty">No users yet.</td></tr>`;

  const roleForForm = editing ? editing.role : ROLES[0];
  const reportsToHidden = roleForForm==='admin' || roleForForm==='sysadmin';

  return `
    <div class="page-header"><h1>Manage Users</h1></div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-4px;">${DB.isLive() ? 'Creating a user here sets up a real sign-in — you stay signed in as yourself while it\'s created.' : 'Demo mode — created users are in-memory mock logins for previewing roles; nothing is saved.'} A user's role controls what they can see. "Reports To" places them in the lead-visibility tree: Executive → Manager → Head — a Manager/Head sees and edits only the leads of the Executives/Managers who report to them, not the whole company.</p>
    <div class="card" style="padding:0;overflow-x:auto;margin-bottom:14px;">
      <table>
        <tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Reports To</th><th>Status</th><th>Actions</th></tr>
        ${rows}
      </table>
    </div>
    <div class="card">
      <h2 class="section-title" style="margin-top:0;">${editing ? 'Edit User' : 'Add User'}</h2>
      <div class="form-grid">
        <div><label>Name</label><input type="text" id="uf-name" value="${editing?editing.name:''}"></div>
        <div><label>Email</label><input type="email" id="uf-email" value="${editing?editing.email:''}" ${editing?'disabled':''}></div>
        <div><label>Phone</label><input type="text" id="uf-phone" value="${editing?(editing.phone||''):''}"></div>
        <div><label>Role</label><select id="uf-role">${ROLES.map(r=>`<option value="${r}" ${roleForForm===r?'selected':''}>${ROLE_LABELS[r]}</option>`).join('')}</select></div>
        <div id="uf-reports-to-wrap" ${reportsToHidden ? 'style="display:none;"' : ''}><label>Reports To</label><select id="uf-reports-to">${reportsToOptionsHtml(roleForForm, editing?editing.reportsTo:'')}</select></div>
        ${editing ? '' : `<div><label>Password</label><input type="password" id="uf-password" placeholder="At least 6 characters"></div>`}
      </div>
      ${editing ? '<p style="font-size:11.5px;color:var(--muted);margin-top:8px;">Email and password can\'t be changed here — the user can reset their password from the sign-in screen\'s "Forgot password?" link.</p>' : ''}
      <div style="margin-top:10px;display:flex;gap:8px;">
        <button class="btn btn-sm btn-teal" id="user-save">${editing?'Update':'Create User'}</button>

function wireUsersEvents(){
  document.querySelectorAll('[data-user-edit]').forEach(b=>b.onclick = () => { editingMasterId=b.dataset.userEdit; render(); });
  document.querySelectorAll('[data-user-toggle]').forEach(b=>b.onclick = async () => { await DB.toggleUser(b.dataset.userToggle); render(); });
  document.querySelectorAll('[data-user-delete]').forEach(b=>b.onclick = async () => {
    const extra = DB.isLive() ? ' Their sign-in account itself must be removed separately in the Firebase Console if you want it fully deleted.' : '';
    if(!confirm('Remove this user\'s access record?' + extra + ' This cannot be undone.')) return;
    await DB.deleteUser(b.dataset.userDelete);
    if(editingMasterId===b.dataset.userDelete) editingMasterId=null;
    render();
  });
  const roleSelect = document.getElementById('uf-role');
  if(roleSelect) roleSelect.onchange = () => {
    const role = roleSelect.value;
    const wrap = document.getElementById('uf-reports-to-wrap');

    if(role==='admin' || role==='sysadmin'){
      wrap.style.display = 'none';
    } else {
      wrap.style.display = '';
      sel.innerHTML = reportsToOptionsHtml(role, '');
