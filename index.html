      editingMasterId = null;
    } else {
      const password = document.getElementById('uf-password').value;
      if(!email){ alert('Email is required.'); return; }
      if(!password || password.length < 6){ alert('Password must be at least 6 characters.'); return; }
      try{
        await DB.createUser({ name, email, phone, role, password, reportsTo });
      }catch(err){
        alert('Could not create user: ' + friendlyAuthError(err));
        return;
      }
    }
    render();
  };
  const cancelBtn = document.getElementById('user-cancel');
  if(cancelBtn) cancelBtn.onclick = () => { editingMasterId=null; render(); };
}

// ---- WORKFLOW CONFIG (own module) -----------------------------------------
// Which role must approve a specific From Status -> To Status transition.
// Each gate applies only to that exact pair and direction — moving forward
// into a stage and moving back out of it are configured (and approved)
// separately. Only pairs one pipeline step apart are offered, since those
// are the only moves the app's Move-to/Move-back actions can perform. Pairs
// with no gate can be moved by anyone with edit access. Edits here are a
// local draft — nothing is saved until "Save Workflow Config" is clicked.
// Role-wise mapping table — same shape as the "Entity Wise Role And Status
// Mapping" reference: Delete | Application Role | From Status | To Status,
// with an "Add New" row and multiple rows allowed per From/To pair (one per
// role permitted to perform that move) or per role (branching to several
// To statuses from the same From status).
let workflowDraftRows = null;
function workflowDraft(){
  if(!workflowDraftRows) workflowDraftRows = WORKFLOW_CONFIG.map(w=>Object.assign({}, w));
  return workflowDraftRows;
}
// "Application Role", "From Status" and "To Status" are three independent
// selects in the Add New row (matching the reference layout), with To's
// options depending on whichever From is currently picked. All three
// re-render the whole view on change (so To can recompute) — which would
// otherwise reset the other two back to their defaults, so all three
// selections are held here and restored as the `selected` option on every
// render, not left to the DOM to remember on its own.
let workflowAddRole = null;
let workflowAddFrom = null;
let workflowAddTo = null;
function renderWorkflowView(){
  const draft = workflowDraft();
  // Any status can be a From, and any OTHER status can be its To — no
  // adjacency restriction (matches the reference: e.g. "To be inspected"
  // branching straight to "Drop Land" or "Finalised", not just next-in-line).
  const fromOptions = STAGE_KEYS.slice();
  if(!workflowAddFrom || !fromOptions.includes(workflowAddFrom)) workflowAddFrom = fromOptions[0];
  if(!workflowAddRole || !ROLES.includes(workflowAddRole)) workflowAddRole = ROLES[0];
  const toOptions = STAGE_KEYS.filter(k=>k!==workflowAddFrom);
  if(!workflowAddTo || !toOptions.includes(workflowAddTo)) workflowAddTo = toOptions[0];
  const rows = draft.map((w,i)=>`<tr>
      <td><button class="btn btn-sm btn-ghost" data-wf-remove="${i}" title="Delete">🗑</button></td>
      <td><select id="wf-role-${i}">${ROLES.map(r=>`<option value="${r}" ${w.role===r?'selected':''}>${ROLE_LABELS[r]}</option>`).join('')}</select></td>
      <td>${stageLabel(w.from)}</td>
      <td>${stageLabel(w.to)}</td>
    </tr>`).join('');
  return `
    <div class="page-header"><h1>Workflow Config</h1></div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-4px;">Role-wise From Status → To Status mapping — pick any From and any To status, including non-adjacent jumps. Each row grants one role permission to perform one specific move (see a lead's Stage &amp; Actions section under Progress Details): the immediate next/back stage stays available to everyone by default unless gated here, while any OTHER mapping shows up as an extra "Move to" option gated to just the role(s) listed. Head can always approve any move regardless of what's configured here.</p>
    <div class="card" style="padding:0;overflow-x:auto;margin-bottom:14px;">
      <table><tr><th></th><th>Application Role</th><th>From Status</th><th>To Status</th></tr>${rows || '<tr><td colspan="4" style="color:var(--muted);padding:14px;">No mappings configured — anyone with edit access can move a lead to any adjacent stage.</td></tr>'}</table>
    </div>
    <div class="card" style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px;">
      <div><label>Application Role</label><select id="wf-add-role">${ROLES.map(r=>`<option value="${r}" ${r===workflowAddRole?'selected':''}>${ROLE_LABELS[r]}</option>`).join('')}</select></div>

    }));

    render();
  };

// ---- STATUS CONFIG (own module) --------------------------------------------
// New (the starting stage for every lead) and Closed (terminal — unlocks
// Final Price/Date, blocks back-navigation) stay pinned first/last since
// other code refers to those two keys specifically. Everything between them
// can be renamed, added, removed and reordered. Changes are staged in a
// draft (mirroring the Workflow Config editor) and only take effect on Save.
let statusDraftRows = null;
function statusDraft(){
  if(!statusDraftRows) statusDraftRows = STAGES.map(s=>Object.assign({}, s));
  return statusDraftRows;
}
function renderStatusConfigView(){
  const draft = statusDraft();
  const rows = draft.map((s,i)=>{
    const pinned = i===0 || i===draft.length-1; // New (first) / Closed (last)
    return `<tr>
      <td>${s.key}</td>
      <td><input type="text" id="stg-label-${i}" value="${s.label}"></td>
      <td><input type="number" id="stg-sla-${i}" value="${s.sla==null?'':s.sla}" placeholder="none" style="max-width:100px;"></td>
      <td style="white-space:nowrap;">
        <button class="btn btn-sm btn-ghost" data-stg-up="${i}" ${i<=1?'disabled':''} title="Move up">↑</button>
        <button class="btn btn-sm btn-ghost" data-stg-down="${i}" ${i>=draft.length-2?'disabled':''} title="Move down">↓</button>
      </td>
      <td>${pinned ? '' : `<button class="btn btn-sm btn-ghost" data-stg-remove="${i}">Remove</button>`}</td>
    </tr>`;
  }).join('');
  return `
    <div class="page-header"><h1>Status Config</h1></div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-4px;">Rename any stage, adjust its SLA, add new stages, remove ones you don't need, or reorder them. "New" always stays the first stage and "Closed" always stays the last (the workflow rules and every lead's history rely on those two).</p>
    <div class="card" style="padding:0;overflow-x:auto;margin-bottom:14px;">
      <table>
        <tr><th>Key</th><th>Label</th><th>SLA (days)</th><th>Reorder</th><th></th></tr>
        ${rows}
      </table>
    </div>
    <div class="card" style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px;">
      <div><label>New Status Label</label><input type="text" id="stg-new-label" placeholder="e.g. Site Re-Visit"></div>
      <button class="btn btn-sm btn-teal" id="stg-add-btn">+ Add Status</button>
      <span style="font-size:12px;color:var(--muted);">Inserted just before Closed.</span>
    </div>
    <div style="margin-top:12px;"><button class="btn btn-sm btn-teal" id="stages-save">Save Status Config</button></div>
  `;
}

function wireStatusConfigEvents(){
  document.querySelectorAll('[data-stg-remove]').forEach(b=>b.onclick = () => {
    const i = parseInt(b.dataset.stgRemove, 10);
    const draft = statusDraft();
    const key = draft[i].key;
    const inUse = (DB.getLeads()||[]).some(l=>l.stage===key);
    if(inUse){ alert('Some leads are currently in "' + draft[i].label + '". Move those leads to another stage before removing it.'); return; }
    if(!confirm('Remove the "' + draft[i].label + '" status? This can\'t be undone.')) return;
    draft.splice(i, 1);
    render();
  });
  document.querySelectorAll('[data-stg-up]').forEach(b=>b.onclick = () => {
    const i = parseInt(b.dataset.stgUp, 10);
    if(i<=1) return;
    const draft = statusDraft();
    [draft[i-1], draft[i]] = [draft[i], draft[i-1]];
    render();
  });
  document.querySelectorAll('[data-stg-down]').forEach(b=>b.onclick = () => {
    const i = parseInt(b.dataset.stgDown, 10);
    const draft = statusDraft();
    if(i>=draft.length-2) return;
    [draft[i+1], draft[i]] = [draft[i], draft[i+1]];
    render();
  });
  const addBtn = document.getElementById('stg-add-btn');
  if(addBtn) addBtn.onclick = () => {
    const label = (document.getElementById('stg-new-label').value || '').trim();
    if(!label){ alert('Enter a label for the new status.'); return; }
    const draft = statusDraft();
    const key = slugifyStageKey(label, draft.map(s=>s.key));
    draft.splice(draft.length-1, 0, { key, label, sla: null }); // just before Closed
    render();
  };
  const saveBtn = document.getElementById('stages-save');
  if(saveBtn) saveBtn.onclick = async () => {
    const draft = statusDraft();
    const rows = draft.map((s,i)=>({
      key: s.key,
      label: (document.getElementById('stg-label-'+i).value || s.label).trim(),
      sla: document.getElementById('stg-sla-'+i).value === '' ? null : parseInt(document.getElementById('stg-sla-'+i).value,10),
    }));
    await DB.saveStages(rows);
    statusDraftRows = null;
    refreshStagesFromDB();
    refreshWorkflowFromDB(); // drop any gates whose pair no longer exists
    render();
  };
}

// ---- PAGE ACCESS (own module) ----------------------------------------------
// One shared, per-role checklist of which pages/nav items each role can
// open — this is a separate, independent layer from the Executive->Manager->
// Head lead-visibility tree (see visibleLeads()/reportsToCandidates() above):
// Page Access decides which PAGES a role can see; "Reports To" still decides
// which LEADS a Manager/Head sees once they're on a lead page. Edits here
// are a local draft — nothing is saved until "Save Page Access" is clicked,
// same pattern as Workflow/Status Config. Head's ('admin') checkboxes are
// always checked and disabled so Head can never accidentally lock itself
// out of Page Access (or anything else) — mirrors the "Head always allowed"
// rule already used for Workflow Config gates.
let pageAccessDraftRows = null;
function pageAccessDraft(){
  if(!pageAccessDraftRows){
    pageAccessDraftRows = KNOWN_VIEWS.map(view => ({
      view,
      roles: (VIEW_ACCESS[view] || DEFAULT_VIEW_ACCESS[view] || []).slice(),
    }));
  }
  return pageAccessDraftRows;
}
function renderPageAccessView(){
  const draft = pageAccessDraft();
  const rows = draft.map((r,i)=>`<tr>
      <td>${PAGE_TITLES[r.view] || r.view}</td>
      ${ROLES.map(role=>`<td style="text-align:center;">
        <input type="checkbox" data-pa-idx="${i}" data-pa-role="${role}" ${r.roles.includes(role) ? 'checked' : ''} ${role==='admin' ? 'disabled title="Head always has access"' : ''}>
      </td>`).join('')}
    </tr>`).join('');
  return `
    <div class="page-header"><h1>Page Access</h1></div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-4px;">Tick which roles can open each page/nav item. This controls page access only — it does not change which leads a Manager or Head can see; that's still driven by "Reports To" under Manage Users. Head always has access to every page and can't be unchecked here, so Head can never get locked out.</p>
    <div class="card" style="padding:0;overflow-x:auto;margin-bottom:14px;">
      <table><tr><th>Page</th>${ROLES.map(role=>`<th>${ROLE_LABELS[role]}</th>`).join('')}</tr>${rows}</table>
    </div>
    <div style="margin-top:12px;"><button class="btn btn-sm btn-teal" id="page-access-save">Save Page Access</button></div>
  `;
}
function wirePageAccessEvents(){
  document.querySelectorAll('[data-pa-idx]').forEach(cb=>cb.addEventListener('change', () => {
    const i = parseInt(cb.dataset.paIdx, 10);
    const role = cb.dataset.paRole;
    const draft = pageAccessDraft();
    const set = new Set(draft[i].roles);
    if(cb.checked) set.add(role); else set.delete(role);
    set.add('admin'); // Head can never be unchecked, even by tampering with the DOM
    draft[i].roles = Array.from(set);
  }));
  const saveBtn = document.getElementById('page-access-save');
  if(saveBtn) saveBtn.onclick = async () => {
    const rows = pageAccessDraft().map(r=>({ view:r.view, roles:r.roles.slice() }));
    await DB.savePageAccess(rows);
    pageAccessDraftRows = null;
    refreshViewAccessFromDB();
    applyRoleVisibility();
    render();
  };
}

      <div class="full"><label>Next Call Date</label>
        <div class="field-pair"><input type="date" id="ov-nextcall" value="${l.nextCallDate||''}"><button class="btn btn-sm btn-teal" id="ov-save-call">Save</button></div>
      </div>
    </div>`;
}

// Renders either the forward "Move to X" block or the backward "Move back
// to X" block for renderStageTab, honoring a from->to gate if one exists
// for that exact pair (see the Workflow Config module).
// slot identifies WHICH move block this is on the tab — 'fwd' (the built-in
// move into the next pipeline stage), 'back' (the built-in move into the
// previous stage), or 'extra-N' (an extra, non-adjacent destination that
// exists purely because Workflow Config has a row for it). Field ids for
// fwd/back are kept exactly as before (unchanged by this extra-destinations
// feature); extra slots get their own suffixed ids so several can coexist.
function transitionFieldIds(slot){
  if(slot==='fwd')  return { btnId:'advance-btn', approverId:'gate-approver-fwd',  remarksId:'gate-remarks-fwd',  priceId:'gate-final-price', dateId:'gate-final-date' };
  if(slot==='back') return { btnId:'back-btn',    approverId:'gate-approver-back', remarksId:'gate-remarks-back', priceId:'gate-final-price', dateId:'gate-final-date' };
  return { btnId:'move-btn-'+slot, approverId:'gate-approver-'+slot, remarksId:'gate-remarks-'+slot, priceId:'gate-final-price-'+slot, dateId:'gate-final-date-'+slot };
}
function renderTransitionBlock(fromKey, target, slot, l){
  if(!target) return '';
  const ids = transitionFieldIds(slot);
  const isBack = slot === 'back';
  const isExtra = slot.indexOf('extra') === 0;
  const gated = isGatedTransition(fromKey, target.key);
  const isClosing = target.key==='closed';
  const btnClass = isBack ? 'btn-ghost' : 'btn-teal';
  const btnLabel = isClosing ? 'Close as Acquired' : (isBack ? `Move back to ${target.label}` : `Move to ${target.label}`);
  if(!gated){
    // Only the built-in adjacent fwd/back moves can ever reach here ungated
    // — an extra slot only exists because Workflow Config has a row for it.
    return `<div style="margin-bottom:14px;"><button class="btn btn-sm ${btnClass}" id="${ids.btnId}">${btnLabel}</button></div>`;
  }
  const canApprove = !currentUser || roleAllowedForGate(currentUser.role, fromKey, target.key);
  const legend = isClosing ? 'Gate: Sign-off to close as Acquired' : `Gate: Approval to move ${isBack ? 'back to' : (isExtra ? 'to' : 'into')} ${target.label}`;
  return `<fieldset><legend>${legend}</legend>
    ${canApprove ? `
    <div class="form-grid">
      <div><label>Approved by</label><input type="text" id="${ids.approverId}" value="${(currentUser&&currentUser.name)||''}" placeholder="${isClosing ? 'MD / Approver name' : 'Approver name'}"></div>
      ${isClosing ? `
      <div><label>Final Price</label><input type="number" id="${ids.priceId}" step="0.01" value="${l.priceValue||''}"></div>
      <div><label>Final Date</label><input type="date" id="${ids.dateId}" value="${todayStr()}"></div>
      ` : ''}
      <div><label>Remarks</label><input type="text" id="${ids.remarksId}"></div>
    </div>
    <button class="btn btn-sm btn-teal" id="${ids.btnId}" style="margin-top:8px;">${btnLabel}</button>
    ` : `<p style="font-size:12.5px;color:var(--muted);">Only ${gateRoleLabels(fromKey, target.key)} (or Head) can approve this transition (see Workflow Config).</p>`}
  </fieldset>`;
}
// Any Workflow Config row whose From is this lead's current stage and whose
// To ISN'T the built-in next/prev stage is an extra, non-adjacent move (e.g.
// a straight "drop to Closed" from partway through the pipeline). Closed is
// terminal, so it never offers any move — including these extras.
function extraTransitionTargets(l, next, prev){
  if(l.stage==='closed') return [];
  const skip = new Set([l.stage, next && next.key, prev && prev.key].filter(Boolean));
  const tos = [...new Set(WORKFLOW_CONFIG.filter(w=>w.from===l.stage && !skip.has(w.to)).map(w=>w.to))];
  return tos.map(k=>STAGES.find(s=>s.key===k)).filter(Boolean);
}

function renderStageTab(l){
  const idx = STAGE_INDEX[l.stage];
  const next = STAGES[idx+1];
  // Closed is terminal — no move-back out of it, matching the outcome
  // (Acquired/Dropped) already being final.
  const canGoBack = idx > 0 && l.stage !== 'closed';
  const prev = canGoBack ? STAGES[idx-1] : null;
  const holdReasons = DB.getMasters('holdReasons');
  const dropReasons = DB.getMasters('dropReasons');

  const holdBlock = `
    <fieldset>
      <legend>On Hold</legend>
      ${l.onHold && l.onHold.active ? `
        <p style="font-size:13px;">Currently on hold since ${fmtDate(l.onHold.since)} — <b>${l.onHold.reasonCode}</b>${l.onHold.notes?': '+l.onHold.notes:''}</p>
        <button class="btn btn-sm btn-teal" id="resume-btn">Resume (clear hold)</button>
      ` : `
        <div class="form-grid">
          <div><label>Reason</label><select id="hold-reason">${holdReasons.map(r=>`<option>${r.label}</option>`).join('')}</select></div>
          <div><label>Notes</label><input type="text" id="hold-notes"></div>
        </div>
        <button class="btn btn-sm btn-ghost" id="hold-btn" style="margin-top:8px;">Put On Hold</button>
      `}
    </fieldset>`;

  const extraTargets = extraTransitionTargets(l, next, prev);
  const extraBlock = extraTargets.map((t,i)=>renderTransitionBlock(l.stage, t, 'extra-'+i, l)).join('');
  const gateBlock = renderTransitionBlock(l.stage, next, 'fwd', l) + renderTransitionBlock(l.stage, prev, 'back', l) + extraBlock;

  const dropBlock = l.stage!=='closed' ? `
    <fieldset><legend>Drop this Lead</legend>
      <div class="form-grid">
        <div><label>Reason</label><select id="drop-reason">${dropReasons.map(r=>`<option>${r.label}</option>`).join('')}</select></div>
        <div><label>Notes</label><input type="text" id="drop-notes"></div>
      </div>
      <button class="btn btn-sm btn-danger" id="drop-btn" style="margin-top:8px;">Close as Dropped</button>
    </fieldset>` : '';

  const closedSummary = l.stage==='closed' ? `
    <fieldset><legend>Outcome</legend>
      ${l.outcome==='acquired'
        ? `<p style="font-size:13px;">Acquired on ${fmtDate(l.finalDate)} at ${fmtNum(l.finalPrice)} / ${EXTENT_UNITS[l.priceUnit]?.label}. Approved by ${l.approval && l.approval.approver||'—'}.</p>`
        : `<p style="font-size:13px;">Dropped — <b>${l.reasonCode||'—'}</b>${l.reasonNotes?': '+l.reasonNotes:''}</p>`}
    </fieldset>` : '';

  return `${gateBlock}${holdBlock}${dropBlock}${closedSummary}`;
}

function renderFeasibilityTab(l){
  const block = (key, label) => `
    <fieldset><legend>${label} Feasibility</legend>
      <div class="form-grid">
        <div><label>Status</label><select id="feas-${key}-status">${FEAS_STATUSES.map(s=>`<option ${l.feasibility[key].status===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div class="full"><label>Notes</label><textarea id="feas-${key}-notes">${l.feasibility[key].notes||''}</textarea></div>
      </div>
    </fieldset>`;
  return block('technical','Technical') + block('financial','Financial') +
    `<button class="btn btn-sm btn-teal" id="save-feas">Save Feasibility</button>`;
}

function renderDocumentsTab(l){
  const rows = (l.documents||[]).map(d=>`<div class="doc-row"><span>${d.name} ${d.url && /^https?:/.test(d.url) ? `<a href="${d.url}" target="_blank" rel="noopener">(view)</a>` : `<span style="color:var(--muted)">— ${d.url}</span>`}</span><span style="color:var(--muted)">${fmtDate(d.addedAt)}</span></div>`).join('') || '<div class="empty">No documents recorded yet.</div>';
  const liveUpload = DB.isLive() && DB.hasStorage && DB.hasStorage();
  return `
    ${rows}
    ${liveUpload ? `
      <div class="inline-add">
        <input type="text" id="doc-name" placeholder="Document name (e.g. FMB Drawing, Patta, EC)">
        <input type="file" id="doc-file">
        <button class="btn btn-sm btn-teal" id="doc-add">Upload</button>
      </div>
      <div id="doc-upload-status" style="font-size:11.5px;color:var(--muted);margin-top:6px;"></div>
    ` : `
      <div class="inline-add">
        <input type="text" id="doc-name" placeholder="Document name (e.g. FMB Drawing, Patta, EC)">
        <input type="text" id="doc-url" placeholder="Reference / URL">
        <button class="btn btn-sm btn-teal" id="doc-add">Add</button>
      </div>
      <p style="font-size:11.5px;color:var(--muted);margin-top:10px;">${DB.isLive() ? 'Enable Firebase Storage on your project to turn this into real file uploads.' : 'Connect this app to Firebase (see FIREBASE_CONFIG near the top of this file) to enable real file uploads here.'}</p>
    `}
  `;
}

function renderNegotiationTab(l){
  const rows = (l.negotiationLog||[]).map(n=>`<tr><td>${fmtDate(n.date)}</td><td>${n.offerBy}</td><td>${fmtNum(n.amount)}</td><td>${n.notes||''}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">No negotiation entries yet.</td></tr>';
  return `
    <table style="margin-bottom:10px;"><tr><th>Date</th><th>By</th><th>Amount</th><th>Notes</th></tr>${rows}</table>
    <div class="inline-add">
      <input type="date" id="neg-date" value="${todayStr()}">
      <select id="neg-by"><option>Us</option><option>Owner</option><option>Mediator</option></select>
      <input type="number" id="neg-amount" step="0.01" placeholder="Amount">
      <input type="text" id="neg-notes" placeholder="Notes">
      <button class="btn btn-sm btn-teal" id="neg-add">Add</button>
    </div>
  `;
}

function renderHistoryTab(l){
  const items = (l.stageHistory||[]).slice().reverse().map(h=>
    `<div class="history-item"><b>${stageLabel(h.stage)}</b> — ${h.note||''}<div class="when">${fmtDate(h.at)} · ${h.by||''}</div></div>`
  ).join('') || '<div class="empty">No history recorded.</div>';
  return items;
}

function wireDetailTabEvents(l){
  {
    const btn = document.getElementById('ov-save-call');
    if(btn) btn.onclick = async () => {
      await DB.updateLead(l.id, { nextCallDate: document.getElementById('ov-nextcall').value });
      renderDetailModal(l.id); render();
    };
  }
  {
    // Shared by the built-in fwd/back moves AND every extra (non-adjacent)
    // destination Workflow Config adds — slot picks which field ids to read
    // (see transitionFieldIds) and noteVerb only affects the stageHistory
    // wording for the two built-in directions.
    function wireMove(slot, targetKey, noteVerb){
      const ids = transitionFieldIds(slot);
      const btn = document.getElementById(ids.btnId);
      if(!btn) return;
      btn.onclick = async () => {
        const targetLabel = stageLabel(targetKey);
        const gated = isGatedTransition(l.stage, targetKey);
        if(gated && currentUser && !roleAllowedForGate(currentUser.role, l.stage, targetKey)){
          alert('Only ' + gateRoleLabels(l.stage, targetKey) + ' (or Head) can approve this transition.'); return;
        }
        const approver = document.getElementById(ids.approverId)?.value.trim();
        if(gated && !approver){
          alert('An approver name is required for this transition.'); return;
        }
        const patch = { stage: targetKey };
        const note = targetKey==='closed' ? 'Closed as Acquired' : (gated ? ('Approved move to '+targetLabel) : (noteVerb || 'Advanced'));
        patch.stageHistory = (l.stageHistory||[]).concat([{stage: targetKey, at:new Date().toISOString(), by: approver || l.assignedExecutive, note}]);
        if(gated){
          patch.approval = { approver, date: todayStr(), remarks: document.getElementById(ids.remarksId)?.value.trim()||'' };
        }
        if(targetKey==='closed'){
          patch.outcome = 'acquired';
          patch.finalPrice = parseFloat(document.getElementById(ids.priceId)?.value)||l.priceValue;
          patch.finalDate = document.getElementById(ids.dateId)?.value || todayStr();
        }
        await DB.updateLead(l.id, patch);
        renderDetailModal(l.id); render();
      };
    }
    const idx = STAGE_INDEX[l.stage];
    const next = STAGES[idx+1];
    const prev = idx > 0 && l.stage !== 'closed' ? STAGES[idx-1] : null;
    if(next) wireMove('fwd', next.key, 'Advanced');
    if(prev) wireMove('back', prev.key, 'Moved back a stage');
    extraTransitionTargets(l, next, prev).forEach((t,i) => wireMove('extra-'+i, t.key));
    const holdBtn = document.getElementById('hold-btn');
    if(holdBtn) holdBtn.onclick = async () => {
      await DB.updateLead(l.id, { onHold: { active:true, reasonCode: document.getElementById('hold-reason').value, notes: document.getElementById('hold-notes').value.trim(), since:new Date().toISOString() } });
      renderDetailModal(l.id); render();
    };
    const resumeBtn = document.getElementById('resume-btn');
    if(resumeBtn) resumeBtn.onclick = async () => {
      await DB.updateLead(l.id, { onHold: { active:false, reasonCode:'', notes:'', since:'' } });
      renderDetailModal(l.id); render();
    };
    const dropBtn = document.getElementById('drop-btn');
    if(dropBtn) dropBtn.onclick = async () => {
      const reason = document.getElementById('drop-reason').value;
      const notes = document.getElementById('drop-notes').value.trim();
      await DB.updateLead(l.id, { stage:'closed', outcome:'dropped', reasonCode:reason, reasonNotes:notes,
        stageHistory: (l.stageHistory||[]).concat([{stage:'closed', at:new Date().toISOString(), by:l.assignedExecutive, note:'Dropped — '+reason}]) });
      renderDetailModal(l.id); render();
    };
  }
  {
    const btn = document.getElementById('save-feas');
    if(btn) btn.onclick = async () => {
      await DB.updateLead(l.id, { feasibility: {
        technical: { status: document.getElementById('feas-technical-status').value, notes: document.getElementById('feas-technical-notes').value },
        financial: { status: document.getElementById('feas-financial-status').value, notes: document.getElementById('feas-financial-notes').value },
      }});
      renderDetailModal(l.id);
    };
  }
  {
    const liveUpload = DB.isLive() && DB.hasStorage && DB.hasStorage();
    const btn = document.getElementById('doc-add');
    if(btn) btn.onclick = async () => {
      const name = document.getElementById('doc-name').value.trim();
      if(!name){ alert('Enter a document name.'); return; }
      if(liveUpload){
        const fileInput = document.getElementById('doc-file');
        const file = fileInput.files[0];
        if(!file){ alert('Choose a file to upload.'); return; }
        const statusEl = document.getElementById('doc-upload-status');
        statusEl.textContent = 'Uploading…';
        try{
          const path = 'leads/'+l.id+'/'+Date.now()+'_'+file.name;
          const ref = DB.storageRef(path);
          await ref.put(file);
          const url = await ref.getDownloadURL();
          await DB.updateLead(l.id, { documents: (l.documents||[]).concat([{name, url, storagePath:path, addedAt:new Date().toISOString()}]) });
        }catch(err){
          statusEl.textContent = 'Upload failed: ' + err.message;
          return;
        }
      } else {
        const url = document.getElementById('doc-url').value.trim() || '(no reference given)';
        await DB.updateLead(l.id, { documents: (l.documents||[]).concat([{name, url, addedAt:new Date().toISOString()}]) });
      }
      renderDetailModal(l.id);
    };
  }
  {
    const btn = document.getElementById('neg-add');
    if(btn) btn.onclick = async () => {
      const amount = parseFloat(document.getElementById('neg-amount').value);
      if(isNaN(amount)) { alert('Enter an amount.'); return; }
      await DB.updateLead(l.id, { negotiationLog: (l.negotiationLog||[]).concat([{
        date: document.getElementById('neg-date').value, offerBy: document.getElementById('neg-by').value,
        amount, notes: document.getElementById('neg-notes').value.trim()
      }])});
      renderDetailModal(l.id);
    };
  }
}

// ---- shared modal / view wiring -----------------------------------------
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; currentDetailLeadId = null; }

function wireViewEvents(){
  if(currentView==='dashboard'){
    document.querySelectorAll('[data-drill]').forEach(el=>el.addEventListener('click', ()=>{
      const d = el.dataset.drill;
      if(d==='active') goToLeadsList({ excludeClosed:true });
      if(d==='onHold') goToLeadsList({ onHold:true });
      if(d==='calls') goToLeadsList({ excludeClosed:true, callDueOrOverdue:true });
      if(d==='newLeads') goToLeadsList({ stage:'new' });
      if(d==='yetToSiteVisit') goToLeadsList({ stage: el.dataset.stageKey });
    }));
    document.querySelectorAll('[data-stage]').forEach(el=>el.addEventListener('click', ()=>goToProgress(el.dataset.stage)));
    document.querySelectorAll('[data-source]').forEach(el=>el.addEventListener('click', ()=>goToLeadsList({ source: el.dataset.source })));
    document.querySelectorAll('[data-cp]').forEach(el=>el.addEventListener('click', ()=>goToLeadsList({ channelPartner: el.dataset.cp })));
    document.querySelectorAll('[data-open-id]').forEach(el=>el.addEventListener('click', ()=>openLeadDetail(el.dataset.openId)));
  }

  if(currentView==='progress'){ wireProgressEvents(); }
  if(currentView==='list'){ wireListEvents(); }
  if(currentView==='newLead'){ wireNewLeadViewEvents(); }
  if(currentView==='reports'){ wireReportsEvents(); }
  if(currentView==='configure'){ wireConfigureEvents(); }
  if(currentView==='masters'){ wireMastersEvents(); }
  if(currentView==='users'){ wireUsersEvents(); }
  if(currentView==='workflow'){ wireWorkflowEvents(); }
  if(currentView==='statusConfig'){ wireStatusConfigEvents(); }
  if(currentView==='pageAccess'){ wirePageAccessEvents(); }
}

// ---- Sidebar navigation ---------------------------------------------------
function wireSidebarNav(){
  document.querySelectorAll('#tabs > button[data-view]').forEach(b=>{
    b.onclick = () => {
      if(b.dataset.view==='list'){
        // Always reset to the unfiltered All Leads view.
        goToLeadsList({});
      } else {
        if(b.dataset.view==='workflow'){ workflowDraftRows = null; workflowAddRole = null; workflowAddFrom = null; workflowAddTo = null; } // discard any unsaved draft on fresh entry
        if(b.dataset.view==='statusConfig') statusDraftRows = null;
        if(b.dataset.view==='pageAccess') pageAccessDraftRows = null;
        currentView = b.dataset.view;
        render();
      }
    };
  });
}
wireSidebarNav();

// Restore whichever view is named in the URL hash on load/refresh (deep
// link / reload support), then normalize the history entry so the very
// first back-press doesn't feel like a no-op.
(function initHistory(){
  const initial = (location.hash || '').slice(1);
  if(KNOWN_VIEWS.includes(initial)) currentView = initial;
  history.replaceState({ view: currentView }, '', '#' + currentView);
  window.addEventListener('popstate', (e) => {
    if(document.getElementById('overlay')) closeModal(); // don't leave a stale modal over a different page
    const v = (e.state && e.state.view) || (location.hash || '').slice(1);
    currentView = KNOWN_VIEWS.includes(v) ? v : 'dashboard';
    suppressHistoryPush = true;
    render();
  });
})();

boot();
</script>
